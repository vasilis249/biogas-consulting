<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LabPortal — Αναλύσεις</title>
<style>
  :root{
    --bg:#f6f5f0; --surface:#ffffff; --surface-2:#faf9f5;
    --ink:#1e2a24; --muted:#6c766f; --faint:#9aa39c;
    --primary:#2f7d5b; --primary-ink:#ffffff; --primary-soft:#e6f1ea;
    --border:#e7e3d8; --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 18px rgba(20,30,25,.05);
    --ok:#2f7d5b; --low:#2563c0; --high:#c0392b; --warn:#c77f12;
    --radius:12px; --r-sm:8px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:15px}
  a{color:var(--primary)}
  .hidden{display:none !important}

  /* ---------- buttons / fields ---------- */
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);
       color:var(--ink);padding:9px 14px;border-radius:var(--r-sm);font-weight:600;font-size:14px;transition:.12s}
  .btn:hover{border-color:#cfc9ba;background:var(--surface-2)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
  .btn.primary:hover{background:#28694c}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.sm{padding:6px 10px;font-size:13px}
  .btn.danger{color:var(--high);border-color:#ecc9c4}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
  .field label{font-size:13px;font-weight:600;color:var(--muted)}
  .input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-sm);
       background:var(--surface);color:var(--ink);outline:none}
  .input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:140px}

  /* ---------- auth / setup screens ---------- */
  .center-wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .auth-card{width:100%;max-width:400px;padding:30px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.3px}
  .brand .dot{width:26px;height:26px;border-radius:8px;background:var(--primary);display:grid;place-items:center;color:#fff;font-size:15px}
  .muted{color:var(--muted)}.small{font-size:13px}
  .msg{padding:10px 12px;border-radius:var(--r-sm);font-size:13.5px;margin-bottom:12px}
  .msg.err{background:#fcebe8;color:#9b2d1f;border:1px solid #f1cfc8}
  .msg.ok{background:var(--primary-soft);color:#1f5c42;border:1px solid #c7e3d4}

  /* ---------- app shell ---------- */
  #app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr;min-height:100%;
       grid-template-areas:"side top" "side main"}
  .topbar{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:12px;
          padding:12px 22px;background:var(--surface);border-bottom:1px solid var(--border)}
  .sidebar{grid-area:side;background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:4px}
  .main{grid-area:main;padding:22px;overflow:auto}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);color:var(--ink);
            font-weight:600;font-size:14px;border:none;background:none;width:100%;text-align:left}
  .nav-item:hover{background:var(--surface-2)}
  .nav-item.active{background:var(--primary-soft);color:#1f5c42}
  .nav-item .ic{width:18px;text-align:center}
  .nav-sep{height:1px;background:var(--border);margin:8px 4px}
  .spacer{flex:1}
  .who{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
  .who .role{font-size:12px;color:var(--faint);text-transform:capitalize}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--border);color:var(--muted)}

  /* ---------- content blocks ---------- */
  .page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  h1.page-title{font-size:21px;margin:0;letter-spacing:-.3px}
  .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
  .stat .k{font-size:12.5px;color:var(--muted);font-weight:600}
  .stat .v{font-size:28px;font-weight:800;letter-spacing:-1px;margin-top:4px}
  .stat .v small{font-size:14px;font-weight:600;color:var(--faint)}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .panel h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--border);font-size:15px}
  .panel .body{padding:4px 0}

  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:11px 18px;font-size:14px;border-bottom:1px solid var(--border)}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);font-weight:700;background:var(--surface-2)}
  tr:last-child td{border-bottom:none}
  tbody tr{cursor:default}
  tbody tr.clickable:hover{background:var(--surface-2);cursor:pointer}
  .empty{padding:34px;text-align:center;color:var(--muted)}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
  .badge.ok{background:#e6f1ea;color:#1f5c42}
  .badge.low{background:#e4edfb;color:#1d4e9e}
  .badge.high{background:#fbe6e2;color:#9b2d1f}
  .badge.st{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
  .dot-s{width:8px;height:8px;border-radius:50%;display:inline-block}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(20,28,24,.42);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal{width:100%;max-width:540px;max-height:90vh;overflow:auto}
  .modal .head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
  .modal .head h3{margin:0;font-size:17px}
  .modal .pad{padding:20px}
  .modal .foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border);background:var(--surface-2)}

  .grid-entry th,.grid-entry td{padding:8px 12px}
  .grid-entry input{width:100%}
  .ideal{font-size:12px;color:var(--faint)}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e2a24;color:#fff;
         padding:11px 18px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);z-index:80;opacity:0;transition:.2s}
  .toast.show{opacity:1}

  @media (max-width:820px){
    #app{grid-template-columns:1fr;grid-template-areas:"top" "main";}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:230px;z-index:40;transform:translateX(-105%);transition:.2s;box-shadow:var(--shadow)}
    .sidebar.open{transform:none}
    .menu-btn{display:inline-flex !important}
    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:39}
  }
  .menu-btn{display:none}
</style>
</head>
<body>

<!-- ============================ SETUP (Supabase keys) ============================ -->
<div id="setup" class="center-wrap hidden">
  <div class="auth-card card">
    <div class="brand" style="margin-bottom:6px"><span class="dot">◉</span> LabPortal</div>
    <p class="muted small">Σύνδεσε το Supabase project σου. Το <b>anon key</b> είναι δημόσιο — αποθηκεύεται τοπικά στον browser.</p>
    <div id="setup-msg"></div>
    <div class="field"><label>Supabase URL</label><input id="su-url" class="input" placeholder="https://xxxx.supabase.co"></div>
    <div class="field"><label>Supabase anon key</label><input id="su-key" class="input" placeholder="eyJ..."></div>
    <button class="btn primary" style="width:100%" id="su-save">Αποθήκευση & σύνδεση</button>
  </div>
</div>

<!-- ============================ LOGIN ============================ -->
<div id="login" class="center-wrap hidden">
  <div class="auth-card card">
    <div class="brand" style="margin-bottom:4px"><span class="dot">◉</span> LabPortal</div>
    <p class="muted small" style="margin-top:4px">Πλατφόρμα εργαστηριακών αναλύσεων</p>
    <div id="login-msg"></div>
    <form id="login-form">
      <div class="field"><label>Email</label><input id="li-email" class="input" type="email" autocomplete="username" required></div>
      <div class="field"><label>Κωδικός</label><input id="li-pass" class="input" type="password" autocomplete="current-password" required></div>
      <button class="btn primary" style="width:100%" type="submit" id="li-submit">Είσοδος</button>
    </form>
    <div style="text-align:center;margin-top:12px">
      <button class="btn ghost small" id="li-mode">Δεν έχεις λογαριασμό; Εγγραφή</button>
    </div>
    <div style="text-align:center;margin-top:4px;border-top:1px solid var(--border);padding-top:10px">
      <button class="btn ghost small" id="li-reconf">Αλλαγή Supabase ρυθμίσεων</button>
    </div>
  </div>
</div>

<!-- ============================ APP ============================ -->
<div id="app" class="hidden">
  <div class="scrim hidden" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand" style="font-size:18px;margin:4px 6px 16px"><span class="dot">◉</span> LabPortal</div>
    <button class="nav-item active" data-view="dashboard"><span class="ic">▣</span> Επισκόπηση</button>
    <button class="nav-item" data-view="samples"><span class="ic">🧪</span> Δείγματα</button>
    <button class="nav-item" data-view="bulk"><span class="ic">⊞</span> Μαζική καταχώρηση</button>
    <button class="nav-item" data-view="reports"><span class="ic">📊</span> Reports</button>
    <div class="nav-sep"></div>
    <div class="small muted" style="padding:4px 12px;font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.05em">Διαχείριση</div>
    <button class="nav-item" data-view="units"><span class="ic">🏭</span> Μονάδες</button>
    <button class="nav-item" data-view="params"><span class="ic">⚙</span> Παράμετροι</button>
    <button class="nav-item nav-admin" data-view="finance"><span class="ic">€</span> Οικονομικά</button>
    <button class="nav-item nav-admin" data-view="users"><span class="ic">👥</span> Χρήστες</button>
    <button class="nav-item nav-admin" data-view="audit"><span class="ic">🗂</span> Αρχείο ενεργειών</button>
    <button class="nav-item nav-platform" data-view="settings"><span class="ic">🎨</span> Ρυθμίσεις πελάτη</button>
    <button class="nav-item" data-view="security"><span class="ic">🔒</span> Ασφάλεια</button>
    <div class="spacer"></div>
    <div class="nav-sep"></div>
    <button class="nav-item" id="nav-logout"><span class="ic">⎋</span> Αποσύνδεση</button>
  </aside>

  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="btn ghost menu-btn" id="menu-btn" style="padding:6px 10px">☰</button>
      <div>
        <div id="tenant-area"></div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <button class="btn ghost sm" id="lang-toggle" title="Language" style="font-weight:700">EN</button>
      <div class="who">
        <span id="who-email" style="font-weight:600;font-size:13.5px"></span>
        <span class="role" id="who-role"></span>
      </div>
    </div>
  </header>

  <main class="main" id="main"></main>
</div>

<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ============================================================================
   LabPortal — single-file client (vanilla JS + Supabase)
   Original work. Tenant isolation is enforced by Postgres RLS (see db/schema.sql);
   this client just reads/writes and the DB decides what each user may touch.
   ========================================================================== */

/* ---- Config: hardcode here, or leave blank and use the setup screen ---- */
const HARDCODED_URL = "";
const HARDCODED_KEY = "";

const CFG = {
  url: HARDCODED_URL || localStorage.getItem("lp-url") || "",
  key: HARDCODED_KEY || localStorage.getItem("lp-key") || "",
};

let sb = null;                                   // supabase client
const state = {
  user: null, profile: null,
  tenants: [], tenantId: null,                   // active tenant (platform admin can switch)
  params: [], units: [],
  view: "dashboard",
  sample: null,                                  // currently opened sample (detail)
};

/* ---------- tiny DOM helpers ---------- */
const $ = (s, r=document)=>r.querySelector(s);
const $$ = (s, r=document)=>[...r.querySelectorAll(s)];
const el = (tag, props={}, ...kids)=>{
  const n=document.createElement(tag);
  for(const[k,v] of Object.entries(props)){
    if(k==="class")n.className=v;
    else if(k==="html")n.innerHTML=v;
    else if(k.startsWith("on")&&typeof v==="function")n.addEventListener(k.slice(2),v);
    else if(v!=null)n.setAttribute(k,v);
  }
  for(const kid of kids.flat()){ if(kid!=null) n.append(kid.nodeType?kid:document.createTextNode(kid)); }
  return n;
};
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = d => d ? new Date(d).toLocaleDateString("el-GR") : "—";
const monthStart = ()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).toISOString();};
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600);}
function show(id){["setup","login","app"].forEach(v=>$("#"+v).classList.toggle("hidden",v!==id));}
function setMsg(where,type,text){const c=$(where);c.innerHTML=text?`<div class="msg ${type}">${esc(text)}</div>`:"";}

const SAMPLE_KIND = {leaf:"Φύλλο",soil:"Έδαφος",water:"Νερό",reservoir:"Λιμνοδεξαμενή",fruit:"Καρπός",substrate:"Υπόστρωμα",other:"Άλλο"};
const STATUS = {draft:"Πρόχειρο",received:"Παραλήφθηκε",analyzing:"Σε ανάλυση",done:"Ολοκληρώθηκε",archived:"Αρχείο"};

/* classify a value against a parameter's ideal range */
function rangeOf(val, p){
  if(val==null||p==null) return "na";
  if(p.ideal_min!=null && val<p.ideal_min) return "low";
  if(p.ideal_max!=null && val>p.ideal_max) return "high";
  return "ok";
}
function rangeBadge(st){
  if(st==="low")  return `<span class="badge low">▼ χαμηλό</span>`;
  if(st==="high") return `<span class="badge high">▲ υψηλό</span>`;
  if(st==="ok")   return `<span class="badge ok">✓ ιδανικό</span>`;
  return `<span class="badge st">—</span>`;
}

/* ============================ boot ============================ */
function initClient(){
  if(!CFG.url || !CFG.key) return false;
  sb = supabase.createClient(CFG.url, CFG.key, {auth:{persistSession:true,autoRefreshToken:true}});
  return true;
}

async function boot(){
  if(!initClient()){ show("setup"); return; }
  const { data:{ session } } = await sb.auth.getSession();
  sb.auth.onAuthStateChange((_e, s)=>{ if(!s) { state.user=null; show("login"); } });
  if(session){ await afterAuth(session.user); }
  else show("login");
}

async function onLoggedIn(user){
  state.user = user;
  // load my profile
  const { data:prof, error } = await sb.from("profiles").select("*").eq("id", user.id).single();
  if(error){ setMsg("#login-msg","err","Σφάλμα φόρτωσης προφίλ: "+error.message); show("login"); return; }
  state.profile = prof;

  // resolve tenant(s)
  if(prof.is_platform_admin){
    const { data:ts } = await sb.from("tenants").select("id,name,slug,settings").order("name");
    state.tenants = ts||[];
    state.tenantId = (state.tenants[0]||{}).id || null;
  } else {
    state.tenantId = prof.tenant_id || null;
    if(prof.tenant_id){
      const { data:t } = await sb.from("tenants").select("id,name,slug,settings").eq("id",prof.tenant_id).maybeSingle();
      state.tenants = t?[t]:[];
    }
  }

  $("#who-email").textContent = user.email || prof.full_name || "—";
  $("#who-role").textContent = prof.is_platform_admin ? "platform admin" : (prof.role||"");
  $$(".nav-admin").forEach(b=>b.classList.toggle("hidden", !isAdmin()));
  $$(".nav-platform").forEach(b=>b.classList.toggle("hidden", !state.profile.is_platform_admin));
  applyBranding();
  renderTenantArea();
  show("app");
  await loadRefData();
  go("dashboard");
}

function renderTenantArea(){
  const area = $("#tenant-area"); area.innerHTML="";
  if(state.profile.is_platform_admin){
    if(!state.tenants.length){
      area.append(el("button",{class:"btn sm primary",onclick:createTenant},"＋ Δημιουργία πρώτου πελάτη"));
      return;
    }
    const sel = el("select",{class:"input",style:"padding:6px 10px;max-width:260px",onchange:async e=>{
      state.tenantId=e.target.value; await loadRefData(); go(state.view);
    }});
    state.tenants.forEach(t=>sel.append(el("option",{value:t.id, ...(t.id===state.tenantId?{selected:"selected"}:{})},t.name)));
    area.append(el("div",{style:"display:flex;align-items:center;gap:8px"},
      el("span",{class:"small muted"},"Πελάτης:"), sel,
      el("button",{class:"btn sm ghost",title:"Νέος πελάτης",onclick:createTenant},"＋")));
  } else {
    const t = state.tenants[0];
    area.append(el("div",{class:"pill"}, t? t.name : "Χωρίς αντιστοιχισμένο πελάτη"));
  }
}

/* load parameters + units for the active tenant */
async function loadRefData(){
  state.params=[]; state.units=[];
  if(!state.tenantId){ return; }
  const { data:params } = await sb.from("parameters")
    .select("*").or(`tenant_id.is.null,tenant_id.eq.${state.tenantId}`).order("sort_order");
  // de-dup by code: a tenant-specific param overrides a global one
  const byCode={}; (params||[]).forEach(p=>{ if(!byCode[p.code]||p.tenant_id) byCode[p.code]=p; });
  state.params = Object.values(byCode).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  const { data:units } = await sb.from("units").select("*").eq("tenant_id",state.tenantId).order("name");
  state.units = units||[];
}

/* ============================ navigation ============================ */
function go(view){
  state.view=view; state.sample=null;
  $$(".nav-item[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
  $("#sidebar").classList.remove("open"); $("#scrim").classList.add("hidden");
  if(view==="security"){ renderSecurity(); return; }   // account-level, no tenant needed
  if(!state.tenantId){ renderNoTenant(); return; }
  if(view==="dashboard") renderDashboard();
  else if(view==="samples") renderSamples();
  else if(view==="bulk") renderBulk();
  else if(view==="reports") renderReports();
  else if(view==="units") renderUnits();
  else if(view==="params") renderParams();
  else if(view==="users") renderUsers();
  else if(view==="audit") renderAudit();
  else if(view==="finance") renderFinance();
  else if(view==="settings") renderSettings();
  else if(view==="security") renderSecurity();
}

function renderNoTenant(){
  $("#main").innerHTML = `<div class="panel"><div class="empty">
    ${state.profile.is_platform_admin
      ? "Δημιούργησε έναν πελάτη από το πάνω μέρος για να ξεκινήσεις."
      : "Ο λογαριασμός σου δεν έχει αντιστοιχιστεί σε πελάτη ακόμα. Επικοινώνησε με τον διαχειριστή."}
  </div></div>`;
}

/* ============================ Dashboard ============================ */
async function renderDashboard(){
  const main=$("#main");
  main.innerHTML = `<div class="page-head"><div>
      <h1 class="page-title">Επισκόπηση</h1>
      <div class="sub">Σύνοψη δραστηριότητας & τιμές εκτός ιδανικού εύρους</div>
    </div></div>
    <div class="stats" id="dash-stats"></div>
    <div class="panel"><h3>Τιμές εκτός ιδανικού (πρόσφατες)</h3><div class="body" id="dash-out"></div></div>
    <div style="height:16px"></div>
    <div class="panel"><h3>Πρόσφατα δείγματα</h3><div class="body" id="dash-recent"></div></div>`;

  const T = state.tenantId;
  const [sTotal, sMonth, uCount, recent, analyses] = await Promise.all([
    sb.from("samples").select("id",{count:"exact",head:true}).eq("tenant_id",T),
    sb.from("samples").select("id",{count:"exact",head:true}).eq("tenant_id",T).gte("created_at",monthStart()),
    sb.from("units").select("id",{count:"exact",head:true}).eq("tenant_id",T),
    sb.from("samples").select("id,code,kind,status,taken_at,created_at,unit:units(name)").eq("tenant_id",T).order("created_at",{ascending:false}).limit(8),
    sb.from("analyses").select("value,unit,created_at,parameter:parameters(code,label_el,ideal_min,ideal_max),sample:samples(code,unit:units(name))").eq("tenant_id",T).order("created_at",{ascending:false}).limit(400),
  ]);

  const out = (analyses.data||[]).map(a=>({a,st:rangeOf(a.value,a.parameter)})).filter(x=>x.st==="low"||x.st==="high");
  $("#dash-stats").innerHTML = `
    ${statTile("Σύνολο δειγμάτων", sTotal.count??0)}
    ${statTile("Δείγματα τον μήνα", sMonth.count??0)}
    ${statTile("Μονάδες", uCount.count??0)}
    ${statTile("Εκτός ιδανικού", out.length, out.length?'var(--high)':'var(--ink)')}`;

  $("#dash-out").innerHTML = out.length ? table(
    ["Μονάδα","Δείγμα","Παράμετρος","Τιμή","Κατάσταση"],
    out.slice(0,12).map(({a,st})=>[
      esc(a.sample?.unit?.name||"—"), esc(a.sample?.code||"—"),
      esc(a.parameter?.label_el||a.parameter?.code||"—"),
      `${esc(a.value)} ${esc(a.unit||"")}`, rangeBadge(st)
    ])) : `<div class="empty">Καμία τιμή εκτός ιδανικού εύρους 🎉</div>`;

  $("#dash-recent").innerHTML = (recent.data||[]).length ? table(
    ["Δείγμα","Μονάδα","Τύπος","Κατάσταση","Ημ/νία δειγμ."],
    recent.data.map(s=>[esc(s.code||"—"),esc(s.unit?.name||"—"),SAMPLE_KIND[s.kind]||s.kind,
      `<span class="badge st">${STATUS[s.status]||s.status}</span>`,fmtDate(s.taken_at)]),
    recent.data.map(s=>()=>openSample(s.id))
  ) : `<div class="empty">Δεν υπάρχουν δείγματα ακόμα.</div>`;
}

/* ---- sample attachments (Supabase Storage: bucket "attachments") ---- */
async function loadFiles(sample){
  const body=$("#files-body"); if(!body) return;
  const { data, error } = await sb.from("files").select("*").eq("sample_id",sample.id).order("created_at",{ascending:false});
  if(error){ body.innerHTML=`<div class="empty">Σφάλμα: ${esc(error.message)}</div>`; return; }
  if(!(data||[]).length){ body.innerHTML=`<div class="empty">Κανένα αρχείο.</div>`; return; }
  body.innerHTML=table(
    ["Όνομα","Μέγεθος","Ημ/νία",""],
    data.map(f=>[esc(f.filename||"—"), f.size_bytes?Math.round(f.size_bytes/1024)+" KB":"—", fmtDate(f.created_at),
      `<span style="display:flex;gap:6px;justify-content:flex-end">
        <button class="btn ghost sm" data-open="${f.id}">Άνοιγμα</button>
        ${canWrite()?`<button class="btn ghost sm danger" data-delf="${f.id}">✕</button>`:""}</span>`])
  );
  (data||[]).forEach(f=>{
    const o=$(`#files-body [data-open="${f.id}"]`); if(o) o.onclick=()=>openFile(f);
    const d=$(`#files-body [data-delf="${f.id}"]`); if(d) d.onclick=()=>deleteFile(sample,f);
  });
}
async function uploadFile(sample, file){
  if(!file) return;
  if(file.size>15*1024*1024) return toast("Το αρχείο ξεπερνά τα 15MB.");
  const safe=file.name.replace(/[^\w.\-]+/g,"_");
  const path=`${state.tenantId}/${sample.id}/${Date.now()}_${safe}`;
  toast("Μεταφόρτωση…");
  const { error:ue } = await sb.storage.from("attachments").upload(path, file, {contentType:file.type||undefined});
  if(ue) return toast("Σφάλμα μεταφόρτωσης: "+ue.message);
  const { error:ie } = await sb.from("files").insert({
    tenant_id:state.tenantId, sample_id:sample.id, storage_path:path,
    filename:file.name, mime:file.type||null, size_bytes:file.size, uploaded_by:state.profile.id
  });
  if(ie){ await sb.storage.from("attachments").remove([path]); return toast("Σφάλμα: "+ie.message); }
  toast("Μεταφορτώθηκε"); loadFiles(sample);
}
async function openFile(f){
  const { data, error } = await sb.storage.from("attachments").createSignedUrl(f.storage_path, 120);
  if(error) return toast("Σφάλμα: "+error.message);
  window.open(data.signedUrl, "_blank");
}
async function deleteFile(sample, f){
  if(!confirm(`Διαγραφή «${f.filename}»;`)) return;
  await sb.storage.from("attachments").remove([f.storage_path]);
  const { error } = await sb.from("files").delete().eq("id",f.id);
  if(error) return toast("Σφάλμα: "+error.message);
  toast("Διαγράφηκε"); loadFiles(sample);
}
function renderAnalyses(an){
  const body=$("#an-body");
  if(!an.length){ body.innerHTML=`<div class="empty">Καμία ανάλυση ακόμα.</div>`; return; }
  body.innerHTML = table(
    ["Παράμετρος","Τιμή","Ιδανικό","Κατάσταση","Μέθοδος",""],
    an.map(a=>{
      const p=a.parameter||{}, st=rangeOf(a.value,p);
      const ideal=(p.ideal_min!=null||p.ideal_max!=null)?`<span class="ideal">${p.ideal_min??"−∞"} – ${p.ideal_max??"+∞"}</span>`:"—";
      return [esc(p.label_el||p.code||"—"), `<b>${esc(a.value)}</b> ${esc(a.unit||"")}`, ideal, rangeBadge(st), esc(a.method||"—"),
        canWrite()?`<button class="btn ghost sm danger" data-del="${a.id}">✕</button>`:""];
    })
  );
  $$("#an-body [data-del]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Διαγραφή ανάλυσης;"))return;
    const {error}=await sb.from("analyses").delete().eq("id",b.dataset.del);
    if(error)return toast("Σφάλμα: "+error.message);
    toast("Διαγράφηκε"); openSample(state.sample.id);
  });
}

function modal(title, bodyNode, onSave, saveLabel="Αποθήκευση"){
  const root=$("#modal-root");
  const close=()=>root.innerHTML="";
  const saveBtn=el("button",{class:"btn primary"},saveLabel);
  const ov=el("div",{class:"overlay",onclick:e=>{if(e.target===ov)close();}},
    el("div",{class:"modal card"},
      el("div",{class:"head"}, el("h3",{},title), el("button",{class:"btn ghost sm",onclick:close},"✕")),
      el("div",{class:"pad"}, bodyNode),
      el("div",{class:"foot"}, el("button",{class:"btn",onclick:close},"Άκυρο"), saveBtn)));
  saveBtn.onclick=async()=>{ saveBtn.disabled=true; try{ await onSave(close);}finally{saveBtn.disabled=false;} };
  root.innerHTML=""; root.append(ov);
}

function monthsAgoISO(n){ const d=new Date(); d.setMonth(d.getMonth()-n); return d.toISOString().slice(0,10); }
function renderReports(){
  const main=$("#main");
  main.innerHTML = `<div class="page-head"><div>

    <div class="panel" style="margin-bottom:16px"><div class="body" style="padding:18px">

        <div class="field"><label>Έως</label><input class="input" id="r-to" type="date" value="${new Date().toISOString().slice(0,10)}"></div>

  const ru=$("#r-unit"); state.units.forEach(u=>ru.append(el("option",{value:u.id},u.name)));
  $("#r-run").onclick=runReport;

async function runReport(){
  const from=$("#r-from").value, to=$("#r-to").value, unit=$("#r-unit").value;
  const res=$("#r-result"); res.innerHTML=`<div class="panel"><div class="empty">Υπολογισμός…</div></div>`;
  let q = sb.from("analyses")
    .select("value,unit,measured_at,created_at,parameter:parameters(code,label_el,ideal_min,ideal_max),sample:samples!inner(code,taken_at,unit_id,unit:units(name))")
    .eq("tenant_id",state.tenantId).order("created_at",{ascending:false}).limit(5000);
  if(from) q=q.gte("created_at",from);
  if(to)   q=q.lte("created_at",to+"T23:59:59");
  const { data, error } = await q;
  if(error){ res.innerHTML=`<div class="panel"><div class="empty">Σφάλμα: ${esc(error.message)}</div></div>`; return; }
  let rows=(data||[]);
  if(unit) rows=rows.filter(a=>a.sample?.unit_id===unit);
  if(!rows.length){ res.innerHTML=`<div class="panel"><div class="empty">Δεν βρέθηκαν μετρήσεις στο διάστημα.</div></div>`; return; }

  // aggregate per parameter
  const agg={};
  rows.forEach(a=>{
    const p=a.parameter||{}; const code=p.code||"—";
    const g=agg[code]||(agg[code]={label:p.label_el||code,n:0,sum:0,min:Infinity,max:-Infinity,out:0,ideal:`${p.ideal_min??"−∞"} – ${p.ideal_max??"+∞"}`});
    if(a.value!=null){ g.n++; g.sum+=Number(a.value); g.min=Math.min(g.min,a.value); g.max=Math.max(g.max,a.value);
      if(rangeOf(a.value,p)!=="ok"&&rangeOf(a.value,p)!=="na") g.out++; }
  });
  const summary=Object.values(agg).map(g=>({
    Παράμετρος:g.label, Πλήθος:g.n, "Μ.Ο.":g.n?+(g.sum/g.n).toFixed(2):null,
    Ελάχιστο:g.n?+g.min.toFixed(2):null, Μέγιστο:g.n?+g.max.toFixed(2):null,
    "Ιδανικό":g.ideal, "Εκτός":g.out, "% Εκτός":g.n?Math.round(100*g.out/g.n)+"%":"0%"
  }));
  state._report={rows,summary,from,to};

  res.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px">
      <div class="small muted">${rows.length} μετρήσεις · ${summary.length} παράμετροι</div>
      <div style="display:flex;gap:10px">
        <button class="btn" id="exp-csv">⤓ CSV</button>
        <button class="btn primary" id="exp-xlsx">⤓ Excel</button>
      </div>
    </div>
    <div class="panel" style="margin-bottom:16px"><h3>Σύνοψη ανά παράμετρο</h3><div class="body">${
      table(["Παράμετρος","Πλήθος","Μ.Ο.","Ελάχ.","Μέγ.","Ιδανικό","Εκτός","% Εκτός"],
        summary.map(s=>[esc(s.Παράμετρος),s.Πλήθος,s["Μ.Ο."]??"—",s.Ελάχιστο??"—",s.Μέγιστο??"—",
          `<span class="ideal">${esc(s.Ιδανικό)}</span>`,s.Εκτός,
          `<b style="color:${parseInt(s["% Εκτός"])>0?'var(--high)':'var(--ok)'}">${s["% Εκτός"]}</b>`]))
    }</div></div>`;
  $("#exp-xlsx").onclick=()=>exportXlsx();
  $("#exp-csv").onclick=()=>exportCsv();
}
function reportDetailRows(){
  return state._report.rows.map(a=>({
    Ημερομηνία:fmtDate(a.created_at), Μονάδα:a.sample?.unit?.name||"", Δείγμα:a.sample?.code||"",
    Παράμετρος:a.parameter?.label_el||a.parameter?.code||"", Τιμή:a.value, Μονάδα_μέτρησης:a.unit||"",
    Κατάσταση:({ok:"ιδανικό",low:"χαμηλό",high:"υψηλό",na:"—"})[rangeOf(a.value,a.parameter||{})]
  }));
}
function exportXlsx(){
  if(!window.XLSX) return toast("Το Excel library δεν φόρτωσε.");
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state._report.summary), "Σύνοψη");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(reportDetailRows()), "Αναλυτικά");
  const name=`LabPortal_report_${state._report.from||"all"}_${state._report.to||""}.xlsx`;
  XLSX.writeFile(wb, name); toast("Excel κατέβηκε");
}
function exportCsv(){
  const rows=reportDetailRows();
  const heads=Object.keys(rows[0]);
  const csv=[heads.join(","),...rows.map(r=>heads.map(h=>{
    const v=r[h]==null?"":String(r[h]); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
  }).join(","))].join("\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
  const a=el("a",{href:URL.createObjectURL(blob),download:`LabPortal_report_${state._report.from||"all"}.csv`});
  document.body.append(a); a.click(); a.remove(); toast("CSV κατέβηκε");
}

async function loadFactors(){
  const body=$("#sec-body"); let factors=[];
  try{ const { data } = await sb.auth.mfa.listFactors(); factors=(data&&data.totp)||[]; }
  catch(e){ body.innerHTML=`<div class="empty">Το MFA δεν είναι διαθέσιμο εδώ: ${esc(e.message||String(e))}</div>`; return; }
  if(!factors.length){
    body.innerHTML=`<div style="padding:18px">
      <p class="muted">Δεν έχεις ενεργό 2FA. Πρόσθεσε εφαρμογή authenticator για επιπλέον ασφάλεια στη σύνδεση.</p>
      <button class="btn primary" id="btn-enroll">Ενεργοποίηση 2FA</button></div>`;
    $("#btn-enroll").onclick=enrollMfa;
  } else {
    body.innerHTML=table(["Συσκευή","Κατάσταση",""],
      factors.map(f=>[esc(f.friendly_name||"Authenticator"),
        `<span class="badge ${f.status==='verified'?'ok':'st'}">${f.status==='verified'?'ενεργό':esc(f.status)}</span>`,
        `<button class="btn ghost sm danger" data-un="${f.id}">Αφαίρεση</button>`]));
    $$("#sec-body [data-un]").forEach(b=>b.onclick=async()=>{
      if(!confirm("Αφαίρεση του 2FA;"))return;
      const {error}=await sb.auth.mfa.unenroll({ factorId:b.dataset.un });
      if(error)return toast("Σφάλμα: "+error.message); toast("Αφαιρέθηκε"); loadFactors();
    });
  }
}
async function enrollMfa(){
  const { data, error } = await sb.auth.mfa.enroll({ factorType:"totp", friendlyName:"Authenticator" });
  if(error) return toast("Σφάλμα: "+error.message);
  const factorId=data.id, qr=data.totp.qr_code, secret=data.totp.secret;
  const body=el("div");
  const qrHtml=(typeof qr==="string" && qr.trim().startsWith("<svg")) ? qr : `<img src="${qr}" alt="QR" style="width:180px;height:180px">`;
  body.innerHTML=`<p class="small muted">Σάρωσε τον κωδικό με Google Authenticator / Authy, μετά βάλε τον 6-ψήφιο κωδικό.</p>
    <div style="text-align:center;margin:12px 0">${qrHtml}</div>
    <p class="small">Χειροκίνητο κλειδί: <code style="user-select:all">${esc(secret)}</code></p>
    <div class="field"><label>Κωδικός επιβεβαίωσης</label>
      <input class="input" id="en-code" inputmode="numeric" maxlength="6" style="letter-spacing:5px;text-align:center;font-size:20px"></div>
    <div id="en-msg"></div>`;
  modal("Ενεργοποίηση 2FA", body, async close=>{
    const code=$("#en-code").value.trim();

  ) : `<div class="empty">Κανένα τιμολόγιο ακόμα.</div>`;

    const d=$(`#fin-body [data-del="${i.id}"]`); if(d) d.onclick=async()=>{

      const{error}=await sb.from("invoices").delete().eq("id",i.id);
      if(error)return toast("Σφάλμα: "+error.message); toast("Διαγράφηκε"); renderFinance();
    };

/* ============================ helpers: table builder ============================ */
function table(headers, rows, rowClicks){
  const thead=`<thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead>`;
  const tbody=`<tbody>${rows.map((r,i)=>`<tr${rowClicks&&rowClicks[i]?' class="clickable" data-ri="'+i+'"':''}>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody>`;
  const html=`<table>${thead}${tbody}</table>`;
  // defer binding of row clicks
  setTimeout(()=>{ if(rowClicks) $$("tr[data-ri]").forEach(tr=>{const f=rowClicks[+tr.dataset.ri]; if(f) tr.onclick=f;}); },0);
  return html;
}

/* after password auth: enforce MFA if the account has a verified factor */
async function afterAuth(user){
  try{
    const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if(aal && aal.currentLevel==="aal1" && aal.nextLevel==="aal2"){ return promptMfa(user); }
  }catch(_){}
  await onLoggedIn(user);
}
function promptMfa(user){
  const body=el("div");
  body.innerHTML=`<p class="muted small">Εισήγαγε τον 6-ψήφιο κωδικό από την εφαρμογή authenticator σου.</p>
    <div class="field"><label>Κωδικός 2FA</label>
      <input class="input" id="mfa-code" inputmode="numeric" maxlength="6" placeholder="000000" style="letter-spacing:5px;text-align:center;font-size:20px"></div>
    <div id="mfa-msg"></div>`;
  modal("Επαλήθευση 2 βημάτων", body, async close=>{
    const code=$("#mfa-code").value.trim();
    const { data:f } = await sb.auth.mfa.listFactors();
    const totp=((f&&f.totp)||[])[0]; if(!totp){ close(); return onLoggedIn(user); }
    const { data:ch, error:ce } = await sb.auth.mfa.challenge({ factorId: totp.id });
    if(ce){ $("#mfa-msg").innerHTML=`<div class="msg err">${esc(ce.message)}</div>`; return; }
    const { error:ve } = await sb.auth.mfa.verify({ factorId: totp.id, challengeId: ch.id, code });
    if(ve){ $("#mfa-msg").innerHTML=`<div class="msg err">Λάθος κωδικός, δοκίμασε ξανά.</div>`; return; }
    close(); await onLoggedIn(user);
  }, "Επαλήθευση");
}

let LANG = localStorage.getItem("lp-lang")||"el";
function trFull(s){
  if(I18N[s]) return I18N[s];
  const m=s.match(/^([＋+←▼▲✓€🧪⚙▣⊞📊🏭👥🗂🎨🔒⎋]+\s*)(.+)$/);  // strip a leading symbol
  if(m && I18N[m[2]]) return m[1]+I18N[m[2]];
  return null;
}
function translateNode(root){
  if(LANG!=="en"||!root) return;
  if(root.nodeType===3){ const t=root.nodeValue.trim(); const e=t&&trFull(t); if(e) root.nodeValue=root.nodeValue.replace(t,e); return; }
  if(root.nodeType!==1) return;
  const walk=document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes=[]; while(walk.nextNode()) nodes.push(walk.currentNode);
  nodes.forEach(n=>{ const t=n.nodeValue.trim(); const e=t&&trFull(t); if(e) n.nodeValue=n.nodeValue.replace(t,e); });
  (root.querySelectorAll?root.querySelectorAll("[placeholder]"):[]).forEach(el2=>{
    const p=el2.getAttribute("placeholder"); if(p&&I18N[p]) el2.setAttribute("placeholder",I18N[p]);
  });
  if(root.hasAttribute&&root.hasAttribute("placeholder")){ const p=root.getAttribute("placeholder"); if(I18N[p]) root.setAttribute("placeholder",I18N[p]); }
}
function initI18n(){
  $("#lang-toggle").textContent = LANG==="en" ? "ΕΛ" : "EN";
  $("#lang-toggle").onclick=()=>{ LANG = LANG==="en"?"el":"en"; localStorage.setItem("lp-lang",LANG); location.reload(); };
  if(LANG!=="en") return;
  document.documentElement.lang="en";
  const obs=new MutationObserver(muts=>muts.forEach(m=>m.addedNodes.forEach(nd=>translateNode(nd))));
  obs.observe(document.body,{childList:true,subtree:true});
  translateNode(document.body);
}
initI18n();

boot();
</script>
</body>
</html>
