<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BioGas — Παραγωγή & Αναλύσεις</title>
<style>
  :root{
    --bg:#f3eee2; --surface:#fffdf8; --surface-2:#f8f2e7;
    --ink:#212c25; --muted:#69726a; --faint:#9aa295;
    --primary:#2d6a49; --primary-ink:#ffffff; --primary-soft:#e4efe3;
    --accent:#b5663f; --accent-soft:#f6e9df;
    --border:#e9e1d0; --shadow:0 1px 2px rgba(45,55,40,.05),0 8px 24px rgba(60,50,30,.07);
    --ok:#2d6a49; --low:#2563c0; --high:#bb3b2c; --warn:#b9771a;
    --radius:14px; --r-sm:9px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;max-width:100%;overflow-x:hidden}
  body{font-family:var(--font);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
       background:var(--bg);
       background-image:radial-gradient(1200px 600px at 100% -5%,rgba(45,106,73,.06),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(181,102,63,.05),transparent 55%);
       background-attachment:fixed;}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:15px}
  a{color:var(--primary)}
  .hidden{display:none !important}

  /* ---------- buttons / fields ---------- */
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);
       color:var(--ink);padding:9px 14px;border-radius:var(--r-sm);font-weight:600;font-size:14px;transition:.12s}
  .btn:hover{border-color:#cfc9ba;background:var(--surface-2)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
  .btn.primary:hover{background:#28694c}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.sm{padding:6px 10px;font-size:13px}
  .btn.danger{color:var(--high);border-color:#ecc9c4}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
  .field label{font-size:13px;font-weight:600;color:var(--muted)}
  .input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-sm);
       background:var(--surface);color:var(--ink);outline:none}
  .input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:140px}
  .fieldset-sep{margin:6px 0 12px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

  /* ---------- auth / setup screens ---------- */
  .center-wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .auth-card{width:100%;max-width:400px;padding:30px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.3px}
  .brand .dot{width:26px;height:26px;border-radius:8px;background:var(--primary);display:grid;place-items:center;color:#fff;font-size:15px}
  .muted{color:var(--muted)}.small{font-size:13px}
  .msg{padding:10px 12px;border-radius:var(--r-sm);font-size:13.5px;margin-bottom:12px}
  .msg.err{background:#fcebe8;color:#9b2d1f;border:1px solid #f1cfc8}
  .msg.ok{background:var(--primary-soft);color:#1f5c42;border:1px solid #c7e3d4}

  /* ---------- app shell ---------- */
  #app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr;min-height:100%;
       grid-template-areas:"side top" "side main"}
  .topbar{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:12px;
          padding:12px 22px;background:var(--surface);border-bottom:1px solid var(--border)}
  .sidebar{grid-area:side;background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .main{grid-area:main;padding:22px;overflow:auto;min-width:0}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);color:var(--ink);
            font-weight:600;font-size:14px;border:none;background:none;width:100%;text-align:left}
  .nav-item:hover{background:var(--surface-2)}
  .nav-item.active{background:var(--primary-soft);color:#1f5c42}
  .nav-item .ic{width:18px;text-align:center}
  .nav-sep{height:1px;background:var(--border);margin:8px 4px}
  .spacer{flex:1}
  .who{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
  .who .role{font-size:12px;color:var(--faint);text-transform:capitalize}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--border);color:var(--muted)}

  /* ---------- content blocks ---------- */
  .page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  h1.page-title{font-size:21px;margin:0;letter-spacing:-.3px}
  .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
  .stat .k{font-size:12.5px;color:var(--muted);font-weight:600}
  .stat .v{font-size:28px;font-weight:800;letter-spacing:-1px;margin-top:4px}
  .stat .v small{font-size:14px;font-weight:600;color:var(--faint)}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .panel h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--border);font-size:15px}
  .panel .body{padding:4px 0}

  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:11px 18px;font-size:14px;border-bottom:1px solid var(--border)}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);font-weight:700;background:var(--surface-2)}
  tr:last-child td{border-bottom:none}
  tbody tr{cursor:default}
  tbody tr.clickable:hover{background:var(--surface-2);cursor:pointer}
  .empty{padding:34px;text-align:center;color:var(--muted)}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
  .badge.ok{background:#e6f1ea;color:#1f5c42}
  .badge.low{background:#e4edfb;color:#1d4e9e}
  .badge.high{background:#fbe6e2;color:#9b2d1f}
  .badge.st{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
  .badge.warnb{background:#fbf0dc;color:#8a5a0b}
  th,td{white-space:nowrap}
  .badge,.btn{white-space:nowrap}
  .panel .body{overflow-x:auto}
  .cell-wrap{white-space:normal;min-width:260px;max-width:520px}
  #mb-mass td,#mb-energy td{white-space:normal}
  .nav-badge{margin-left:auto;background:var(--warn);color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:1px 7px;line-height:1.5}
  .nav-badge.crit{background:var(--high)}
  .hint{border-radius:var(--r-sm);padding:10px 14px;margin-bottom:16px;font-size:13.5px;line-height:1.5}
  .hint.warn{background:#fbf0dc;border:1px solid #f0dcb3;color:#6d4708}
  .hint.ok{background:var(--primary-soft);border:1px solid #c7e3d4;color:#1f5c42}
  .hint.info{background:var(--surface-2);border:1px solid var(--border);color:var(--muted)}
  .hint ul{margin:4px 0 0;padding-left:18px}
  .dot-s{width:8px;height:8px;border-radius:50%;display:inline-block}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(20,28,24,.42);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal{width:100%;max-width:540px;max-height:90vh;overflow:auto}
  .modal .head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
  .modal .head h3{margin:0;font-size:17px}
  .modal .pad{padding:20px}
  .modal .foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border);background:var(--surface-2)}

  .grid-entry th,.grid-entry td{padding:8px 12px}
  .grid-entry input{width:100%}
  .ideal{font-size:12px;color:var(--faint)}

  /* ---------- «Σήμερα» ---------- */
  .today-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:16px;margin-bottom:18px}
  .uc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;min-width:0}
  .uc-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .uc-head h2{margin:0;font-size:18px}
  .light{font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .light.ok{background:#e6f1ea;color:#1f5c42} .light.warn{background:#fbf0dc;color:#8a5a0b} .light.crit{background:#fbe6e2;color:#9b2d1f}
  .uc-diag{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
  .uc-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
  .kp{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 10px;min-width:0}
  .kp .k{font-size:12px;color:var(--muted);font-weight:600}
  .kp .v{font-size:19px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
  .kp .s{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .uc-lab{width:100%;border-collapse:collapse;margin-top:12px}
  .uc-lab th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:3px 6px 3px 0;white-space:nowrap;
             background:none;text-transform:none;letter-spacing:0;border:0}
  .uc-lab tr{border:0} .uc-lab td{border:0}
  .uc-lab td{padding:3px 0;font-size:14px}
  .uc-lab td.num{font-weight:700;white-space:nowrap;padding-right:8px}
  .uc-lab td:last-child{text-align:right;width:124px}
  .spark{display:inline-block;vertical-align:middle;overflow:visible}
  .spark-empty{color:var(--faint)}
  .trend{font-size:12px;font-weight:600;color:var(--muted);margin-left:4px;white-space:nowrap}
  .pl-state{margin:0 0 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .pl-state>.small{flex-basis:100%}
  .chip{display:inline-flex;gap:4px;align-items:center;font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2)}
  .chip.warn{border-color:#f0dcb3;background:#fdf8ee} .chip.crit{border-color:#ecc9c4;background:#fdf3f1}
  .feed-note{font-size:12px;color:var(--muted);max-width:240px;overflow:hidden;text-overflow:ellipsis}
  .uc-issues{margin-top:12px;display:flex;flex-direction:column;gap:6px}
  .issue{border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 10px;background:var(--surface-2)}
  .issue.critical{border-color:#ecc9c4;background:#fdf3f1} .issue.warning{border-color:#f0dcb3;background:#fdf8ee}
  .issue summary{cursor:pointer;font-size:14px;min-height:28px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .issue ul,.plain-list{margin:6px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
  .plain-list{padding:14px 18px;margin:0}
  @media (max-width:420px){ .uc-kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .uc{padding:14px}
    .uc-lab td:last-child{width:82px} .spark{width:80px;height:20px} .trend{font-size:11px} }

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e2a24;color:#fff;
         padding:11px 18px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);z-index:80;opacity:0;transition:.2s;
         pointer-events:none;max-width:calc(100vw - 32px)}   /* invisible toast must never swallow taps */
  .toast.show{opacity:1}

  @media (max-width:820px){
    #app{grid-template-columns:1fr;grid-template-areas:"top" "main";}
    .sidebar{position:fixed;left:0;top:0;bottom:0;height:auto;width:230px;z-index:40;transform:translateX(-105%);transition:.2s;box-shadow:var(--shadow)}
    .sidebar.open{transform:none}
    .menu-btn{display:inline-flex !important}
    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:39}
  }
  .menu-btn{display:none}

  @media print{
    .sidebar,.topbar,.menu-btn,#lang-toggle,.page-head button,.btn{display:none !important}
    #app{display:block}
    .main{padding:0;overflow:visible}
    .panel{box-shadow:none;border-color:#ccc}
    body{background:#fff}
  }
</style>
</head>
<body>

<!-- ============================ SETUP (Supabase keys) ============================ -->
<div id="setup" class="center-wrap hidden">
  <div class="auth-card card">
    <div class="brand" style="margin-bottom:6px"><span class="dot">◉</span> BioGas</div>
    <p class="muted small">Σύνδεσε το Supabase project σου. Το <b>anon key</b> είναι δημόσιο — αποθηκεύεται τοπικά στον browser.</p>
    <div id="setup-msg"></div>
    <div class="field"><label>Supabase URL</label><input id="su-url" class="input" placeholder="https://xxxx.supabase.co"></div>
    <div class="field"><label>Supabase anon key</label><input id="su-key" class="input" placeholder="eyJ..."></div>
    <button class="btn primary" style="width:100%" id="su-save">Αποθήκευση & σύνδεση</button>
  </div>
</div>

<!-- ============================ LOGIN ============================ -->
<div id="login" class="center-wrap hidden">
  <div class="auth-card card">
    <div class="brand" style="margin-bottom:4px"><span class="dot">◉</span> BioGas</div>
    <p class="muted small" style="margin-top:4px">Πλατφόρμα εργαστηριακών αναλύσεων</p>
    <div id="login-msg"></div>
    <form id="login-form">
      <div class="field"><label>Email</label><input id="li-email" class="input" type="email" autocomplete="username" required></div>
      <div class="field"><label>Κωδικός</label><input id="li-pass" class="input" type="password" autocomplete="current-password" required></div>
      <button class="btn primary" style="width:100%" type="submit" id="li-submit">Είσοδος</button>
    </form>
    <div style="display:flex;flex-direction:column;gap:2px;align-items:center;margin-top:12px">
      <button class="btn ghost small" id="li-mode">Δεν έχεις λογαριασμό; Εγγραφή</button>
      <div style="display:flex;gap:4px">
        <button class="btn ghost small" id="li-otp">Είσοδος με κωδικό email</button>
        <button class="btn ghost small" id="li-forgot">Ξέχασα τον κωδικό</button>
      </div>
    </div>
    <div style="text-align:center;margin-top:4px;border-top:1px solid var(--border);padding-top:10px">
      <button class="btn ghost small" id="li-reconf">Αλλαγή Supabase ρυθμίσεων</button>
    </div>
  </div>
</div>

<!-- ============================ APP ============================ -->
<div id="app" class="hidden">
  <div class="scrim hidden" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand" style="font-size:18px;margin:4px 6px 16px"><span class="dot">◉</span> BioGas</div>
    <button class="nav-item active" data-view="dashboard"><span class="ic">☀</span> Σήμερα</button>
    <button class="nav-item" data-view="samples"><span class="ic">🧪</span> Δείγματα</button>
    <button class="nav-item" data-view="bulk"><span class="ic">⊞</span> Μαζική καταχώρηση</button>
    <button class="nav-item" data-view="production"><span class="ic">⚡</span> Παραγωγή</button>
    <button class="nav-item" data-view="feeding"><span class="ic">🌾</span> Τροφοδοσία</button>
    <button class="nav-item" data-view="digestate"><span class="ic">♻</span> Χώνευμα</button>
    <button class="nav-item" data-view="massbalance"><span class="ic">⚖</span> Ισοζύγιο</button>
    <button class="nav-item" data-view="red3"><span class="ic">🌱</span> Αειφορία</button>
    <button class="nav-item" data-view="alerts"><span class="ic">🔔</span> Ειδοποιήσεις<span class="nav-badge hidden" id="alert-badge"></span></button>
    <button class="nav-item" data-view="reports"><span class="ic">📊</span> Reports</button>
    <div class="nav-sep"></div>
    <div class="small muted" style="padding:4px 12px;font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.05em">Διαχείριση</div>
    <button class="nav-item" data-view="units"><span class="ic">🏭</span> Μονάδες</button>
    <button class="nav-item" data-view="feedstocks"><span class="ic">🧺</span> Υποστρώματα</button>
    <button class="nav-item" data-view="params"><span class="ic">⚙</span> Παράμετροι</button>
    <button class="nav-item nav-admin" data-view="finance"><span class="ic">€</span> Οικονομικά</button>
    <button class="nav-item nav-admin" data-view="users"><span class="ic">👥</span> Χρήστες</button>
    <button class="nav-item nav-admin" data-view="audit"><span class="ic">🗂</span> Αρχείο ενεργειών</button>
    <button class="nav-item nav-platform" data-view="settings"><span class="ic">🎨</span> Ρυθμίσεις πελάτη</button>
    <button class="nav-item" data-view="security"><span class="ic">🔒</span> Ασφάλεια</button>
    <div class="spacer"></div>
    <div class="nav-sep"></div>
    <button class="nav-item" id="nav-logout"><span class="ic">⎋</span> Αποσύνδεση</button>
  </aside>

  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="btn ghost menu-btn" id="menu-btn" style="padding:6px 10px">☰</button>
      <div>
        <div id="tenant-area"></div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <button class="btn ghost sm" id="lang-toggle" title="Language" style="font-weight:700">EN</button>
      <div class="who">
        <span id="who-email" style="font-weight:600;font-size:13.5px"></span>
        <span class="role" id="who-role"></span>
      </div>
    </div>
  </header>

  <main class="main" id="main"></main>
</div>

<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="lib/red3.js"></script>
<script>
/* ============================================================================
   LabPortal — single-file client (vanilla JS + Supabase)
   Original work. Tenant isolation is enforced by Postgres RLS (see db/schema.sql);
   this client just reads/writes and the DB decides what each user may touch.
   ========================================================================== */

/* ---- Config: hardcode here, or leave blank and use the setup screen ---- */
const HARDCODED_URL = "";
const HARDCODED_KEY = "";

const CFG = {
  url: HARDCODED_URL || localStorage.getItem("lp-url") || "",
  key: HARDCODED_KEY || localStorage.getItem("lp-key") || "",
};

let sb = null;                                   // supabase client
const state = {
  user: null, profile: null,
  tenants: [], tenantId: null,                   // active tenant (platform admin can switch)
  params: [], units: [],
  view: "dashboard",
  sample: null,                                  // currently opened sample (detail)
};

/* ---------- tiny DOM helpers ---------- */
const $ = (s, r=document)=>r.querySelector(s);
const $$ = (s, r=document)=>[...r.querySelectorAll(s)];
const el = (tag, props={}, ...kids)=>{
  const n=document.createElement(tag);
  for(const[k,v] of Object.entries(props)){
    if(k==="class")n.className=v;
    else if(k==="html")n.innerHTML=v;
    else if(k.startsWith("on")&&typeof v==="function")n.addEventListener(k.slice(2),v);
    else if(v!=null)n.setAttribute(k,v);
  }
  for(const kid of kids.flat()){ if(kid!=null) n.append(kid.nodeType?kid:document.createTextNode(kid)); }
  return n;
};
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = d => d ? new Date(d).toLocaleDateString("el-GR") : "—";
// Calendar dates in the user's local time zone. toISOString() is UTC, so between
// 00:00 and 02:00/03:00 Greek time it returns *yesterday* — a night shift would log the wrong day.
const localDate = (d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const localMonth = (d=new Date())=>localDate(d).slice(0,7);
const daysAgoDate = n=>{ const d=new Date(); d.setDate(d.getDate()-n); return localDate(d); };
const monthStart = ()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).toISOString();};
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600);}
function show(id){["setup","login","app"].forEach(v=>$("#"+v).classList.toggle("hidden",v!==id));}
function setMsg(where,type,text){const c=$(where);c.innerHTML=text?`<div class="msg ${type}">${esc(text)}</div>`:"";}

const SAMPLE_KIND = {digester:"Χωνευτής",substrate_in:"Υπόστρωμα/Τροφοδοσία",biogas:"Βιοαέριο",digestate:"Χώνευμα (digestate)",influent:"Εισροή",effluent:"Εκροή",water:"Νερό",other:"Άλλο",
  leaf:"Φύλλο",soil:"Έδαφος",reservoir:"Λιμνοδεξαμενή",fruit:"Καρπός",substrate:"Υπόστρωμα"};

/* classify a value against a parameter's ideal range */
function rangeOf(val, p){
  if(val==null||p==null) return "na";
  if(p.ideal_min==null && p.ideal_max==null) return "na";   // informational parameter, no band
  if(p.ideal_min!=null && val<p.ideal_min) return "low";
  if(p.ideal_max!=null && val>p.ideal_max) return "high";
  return "ok";
}
function rangeBadge(st){
  if(st==="low")  return `<span class="badge low">▼ χαμηλό</span>`;
  if(st==="high") return `<span class="badge high">▲ υψηλό</span>`;
  if(st==="ok")   return `<span class="badge ok">✓ ιδανικό</span>`;
  return `<span class="badge st">—</span>`;
}

/* ============================ boot ============================ */
function initClient(){
  if(!CFG.url || !CFG.key) return false;
  sb = supabase.createClient(CFG.url, CFG.key, {auth:{persistSession:true,autoRefreshToken:true}});
  return true;
}

async function boot(){
  if(!initClient()){ show("setup"); return; }
  const { data:{ session } } = await sb.auth.getSession();
  sb.auth.onAuthStateChange((_e, s)=>{ if(!s) { state.user=null; show("login"); } });
  if(session){ await afterAuth(session.user); }
  else show("login");
}

async function onLoggedIn(user){
  state.user = user;
  // load my profile
  const { data:prof, error } = await sb.from("profiles").select("*").eq("id", user.id).single();
  if(error){ setMsg("#login-msg","err","Σφάλμα φόρτωσης προφίλ: "+error.message); show("login"); return; }
  state.profile = prof;

  // resolve tenant(s)
  if(prof.is_platform_admin){
    const { data:ts } = await sb.from("tenants").select("id,name,slug,settings").order("name");
    state.tenants = ts||[];
    state.tenantId = (state.tenants[0]||{}).id || null;
  } else {
    state.tenantId = prof.tenant_id || null;
    if(prof.tenant_id){
      const { data:t } = await sb.from("tenants").select("id,name,slug,settings").eq("id",prof.tenant_id).maybeSingle();
      state.tenants = t?[t]:[];
    }
  }

  $("#who-email").textContent = user.email || prof.full_name || "—";
  $("#who-role").textContent = prof.is_platform_admin ? "platform admin" : (prof.role||"");
  $$(".nav-admin").forEach(b=>b.classList.toggle("hidden", !isAdmin()));
  $$(".nav-platform").forEach(b=>b.classList.toggle("hidden", !state.profile.is_platform_admin));
  applyBranding();
  renderTenantArea();
  show("app");
  updateLastSeen(); if(!state._hb) state._hb=setInterval(()=>{ updateLastSeen(); refreshAlertBadge(); }, 60000);  // presence + alarms
  await loadRefData();
  go("dashboard");
}
function updateLastSeen(){
  try{ if(state.user) sb.from("profiles").update({last_seen:new Date().toISOString()}).eq("id",state.user.id); }catch(_){}
}
function activityBadge(ls){
  if(!ls) return `<span class="badge st">—</span>`;
  const mins=(Date.now()-new Date(ls).getTime())/60000;
  if(mins<5)    return `<span class="badge ok">● online</span>`;
  if(mins<60)   return `<span class="muted small">πριν ${Math.floor(mins)}′</span>`;
  if(mins<1440) return `<span class="muted small">πριν ${Math.floor(mins/60)}ω</span>`;
  return `<span class="muted small">${fmtDate(ls)}</span>`;
}

function renderTenantArea(){
  const area = $("#tenant-area"); area.innerHTML="";
  if(state.profile.is_platform_admin){
    if(!state.tenants.length){
      area.append(el("button",{class:"btn sm primary",onclick:createTenant},"＋ Δημιουργία πρώτου πελάτη"));
      return;
    }
    const sel = el("select",{class:"input",style:"padding:6px 10px;max-width:260px",onchange:async e=>{
      state.tenantId=e.target.value; state.planner=null; state.feedLog=null; state.digLog=null; await loadRefData(); go(state.view);
    }});
    state.tenants.forEach(t=>sel.append(el("option",{value:t.id, ...(t.id===state.tenantId?{selected:"selected"}:{})},t.name)));
    area.append(el("div",{style:"display:flex;align-items:center;gap:8px"},
      el("span",{class:"small muted"},"Πελάτης:"), sel,
      el("button",{class:"btn sm ghost",title:"Νέος πελάτης",onclick:createTenant},"＋")));
  } else {
    const t = state.tenants[0];
    area.append(el("div",{class:"pill"}, t? t.name : "Χωρίς αντιστοιχισμένο πελάτη"));
  }
}

/* load parameters + units for the active tenant */
async function loadRefData(){
  state.params=[]; state.units=[]; state.feedstocks=[]; state.feedstocksAll=[]; state.feedstockById={};
  if(!state.tenantId){ return; }
  const { data:params } = await sb.from("parameters")
    .select("*").or(`tenant_id.is.null,tenant_id.eq.${state.tenantId}`).order("sort_order");
  // de-dup by code: a tenant-specific param overrides a global one
  const byCode={}; (params||[]).forEach(p=>{ if(!byCode[p.code]||p.tenant_id) byCode[p.code]=p; });
  state.params = Object.values(byCode).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  const { data:units } = await sb.from("units").select("*").eq("tenant_id",state.tenantId).order("name");
  state.units = units||[];
  // feedstock registry: a tenant row overrides the global one with the same name
  const { data:fs } = await sb.from("feedstocks").select("*").or(`tenant_id.is.null,tenant_id.eq.${state.tenantId}`).order("name");
  state.feedstockById = {}; (fs||[]).forEach(f=>{ state.feedstockById[f.id]=f; });
  const byName={}; (fs||[]).forEach(f=>{ if(!byName[f.name]||f.tenant_id) byName[f.name]=f; });
  state.feedstocksAll = Object.values(byName).sort((a,b)=>a.name.localeCompare(b.name,"el"));
  state.feedstocks = state.feedstocksAll.filter(f=>f.active!==false);
  refreshAlertBadge();
}

/* ============================ navigation ============================ */
function go(view){
  state.view=view; state.sample=null;
  $$(".nav-item[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
  $("#sidebar").classList.remove("open"); $("#scrim").classList.add("hidden");
  if(view==="security"){ renderSecurity(); return; }   // account-level, no tenant needed
  if(!state.tenantId){ renderNoTenant(); return; }
  if(view==="dashboard") renderDashboard();
  else if(view==="samples") renderSamples();
  else if(view==="bulk") renderBulk();
  else if(view==="production") renderProduction();
  else if(view==="feeding") renderFeeding();
  else if(view==="digestate") renderDigestate();
  else if(view==="massbalance") renderMassBalance();
  else if(view==="red3") renderRed3();
  else if(view==="alerts") renderAlerts();
  else if(view==="feedstocks") renderFeedstocks();
  else if(view==="reports") renderReports();
  else if(view==="units") renderUnits();
  else if(view==="params") renderParams();
  else if(view==="users") renderUsers();
  else if(view==="audit") renderAudit();
  else if(view==="finance") renderFinance();
  else if(view==="settings") renderSettings();
  else if(view==="security") renderSecurity();
}

/* ============================ Dashboard ============================ */
/* ============================ «Σήμερα» — morning round per digester ============================
   Operator review Top-10 #4/#5: one card per digester with yesterday's production, the latest
   feeding (OLR/HRT), the latest lab values with trend arrows and 8-week sparklines, and the
   active alarms grouped into a diagnosis («πιθανή οξίνιση») instead of one row per signal. */
const TODAY_LAB = [   // code, short label, decimals
  ["fos_tac","FOS/TAC",2], ["vfa","VFA",0], ["ph_dig","pH",2], ["nh4","NH₄-N",0], ["ch4","CH₄ εργ.",1], ["h2s","H₂S",0]];
const SPARK_DAYS = 56;
// Inline SVG sparkline on a fixed 8-week window so every card shares the time axis. The line is in the
// de-emphasis ink, the ideal band is a recessive background, the latest point carries the state colour
// (and the value is printed beside it, so state is never colour-only). Every point has a hover tooltip.
function sparkline(pts, o={}){
  const W=120, H=30, P=4;
  if(!pts || pts.length<2) return `<span class="spark-empty">—</span>`;
  const now=Date.now(), t0=now-SPARK_DAYS*864e5, vs=pts.map(p=>p.v);
  let lo=Math.min(...vs), hi=Math.max(...vs);
  if(o.min!=null) lo=Math.min(lo,o.min); if(o.max!=null) hi=Math.max(hi,o.max);
  const span=o.minSpan||1e-9;                          // daily readings: don't magnify ±0.1 °C noise
  if(hi-lo<span){ const m=(hi+lo)/2; hi=m+span/2; lo=m-span/2; }
  const x=t=>P+(Math.min(Math.max(t,t0),now)-t0)/(now-t0)*(W-2*P), y=v=>H-P-(v-lo)/(hi-lo)*(H-2*P);
  const band=(o.min!=null||o.max!=null) ? (()=>{ const y1=y(o.max!=null?o.max:hi), y2=y(o.min!=null?o.min:lo);
    return `<rect x="0" y="${y1.toFixed(1)}" width="${W}" height="${Math.max(y2-y1,1).toFixed(1)}" fill="var(--primary-soft)"/>`; })() : "";
  const xy=pts.map(p=>[x(p.t),y(p.v)]), last=xy[xy.length-1], fmt=o.fmt||(v=>fmtNum(v));
  const tips=pts.map((p,i)=>`<circle cx="${xy[i][0].toFixed(1)}" cy="${xy[i][1].toFixed(1)}" r="6" fill="transparent"><title>${fmtDate(new Date(p.t))}: ${esc(fmt(p.v))}${o.unit?" "+esc(o.unit):""}</title></circle>`).join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.label||"")}: ${pts.length} τιμές, τελευταία ${esc(fmt(pts[pts.length-1].v))}">${band}`
    + `<polyline points="${xy.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>`
    + `<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5" fill="${o.color||"var(--ink)"}" stroke="var(--surface)" stroke-width="1.5"/>${tips}</svg>`;
}
function trendArrow(cur, prev, decimals){
  if(cur==null || prev==null) return "";
  const d=cur-prev, eps=Math.max(Math.abs(prev)*0.01, Math.pow(10,-(decimals||0))/2);
  const sign=d>0?"+":"", txt=`${sign}${Number(d.toFixed(decimals||0)).toLocaleString("el-GR")}`;
  return Math.abs(d)<eps ? `<span class="trend flat" title="σταθερό">→</span>` : `<span class="trend" title="${txt} από την προηγούμενη">${d>0?"↑":"↓"} ${txt}</span>`;
}
// Same rule as the alarm engine: outside the band = warning, beyond it by > 20 % of the band = critical.
function rangeState(v,p){
  if(v==null || !p || (p.ideal_min==null && p.ideal_max==null)) return "na";
  const lo=p.ideal_min, hi=p.ideal_max; if(!((lo!=null&&v<lo)||(hi!=null&&v>hi))) return "ok";
  let span=(lo!=null&&hi!=null)?hi-lo:null; if(!(span>0)) span=Math.max(Math.abs(hi??lo),1);
  return ((lo!=null&&v<lo-0.2*span)||(hi!=null&&v>hi+0.2*span)) ? "crit" : "warn";
}
// Group a digester's active alarms into operator diagnoses.
function diagnose(alerts){
  const has=re=>alerts.filter(a=>re.test(a.metric||""));
  const groups=[], used=new Set(), take=(title, list, hint)=>{ if(!list.length) return;
    list.forEach(a=>used.add(a.id)); groups.push({title, hint, items:list, sev:list.some(a=>a.severity==="critical")?"critical":"warning"}); };
  const core=has(/^FOS\/TAC|Πτητικά οξέα|^pH/);
  const acid=has(/^FOS\/TAC|Πτητικά οξέα|^pH|Μεθάνιο|Διοξείδιο|^CH₄ %|^OLR/);
  if(core.length && acid.length>=2) take("Πιθανή οξίνιση / υπερφόρτωση", acid, "Μείωσε τη φόρτιση, κόψε πρώτα τα εύπεπτα υποστρώματα, πύκνωσε τις μετρήσεις FOS/TAC.");
  take("Πρόβλημα θέρμανσης", has(/Θερμοκρασία/).filter(a=>!used.has(a.id)), "Έλεγχος λέβητα / εναλλάκτη και κυκλοφορητών.");
  take("ΣΗΘ: χαμηλή διαθεσιμότητα", has(/Ώρες ΣΗΘ/).filter(a=>!used.has(a.id)), "Αν ήταν προγραμματισμένη στάση, σημείωσέ το στην εγγραφή παραγωγής.");
  take("Υψηλό H₂S — έλεγχος αποθείωσης", has(/Υδρόθειο/).filter(a=>!used.has(a.id)), "Έλεγχος δόσης αέρα / FeCl₃ και φίλτρου ενεργού άνθρακα.");
  take("Κίνδυνος αναστολής από αμμωνία", has(/NH₄/).filter(a=>!used.has(a.id)), "Μείωσε υποστρώματα πλούσια σε άζωτο (πουλερικά, χοίρων).");
  alerts.filter(a=>!used.has(a.id)).forEach(a=>take(a.metric||"Ειδοποίηση", [a]));
  return groups.sort((a,b)=>(b.sev==="critical")-(a.sev==="critical")||b.items.length-a.items.length);
}
async function renderDashboard(){
  const main=$("#main"), T=state.tenantId, today=localDate(), yesterday=daysAgoDate(1);
  const since=daysAgoDate(SPARK_DAYS);
  main.innerHTML = `<div class="page-head"><div>
      <h1 class="page-title">Σήμερα</h1>
      <div class="sub">${new Date().toLocaleDateString("el-GR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})} · πρωινός γύρος ανά χωνευτή</div>
    </div></div>
    <div class="stats" id="dash-stats"></div>
    <div class="today-grid" id="dash-units"><div class="empty">Φόρτωση…</div></div>
    <div id="dash-plant"></div>`;
  const [prodQ, feedQ, labQ, alertQ] = await Promise.all([
    sb.from("production").select("*").eq("tenant_id",T).gte("log_date",since).order("log_date",{ascending:true}).limit(5000),
    sb.from("feeding_daily").select("*").eq("tenant_id",T).gte("feed_date",since).order("feed_date",{ascending:true}).limit(5000),
    sb.from("analyses").select("value,measured_at,created_at,parameter:parameters(code,label_el,ideal_min,ideal_max,default_unit),sample:samples(unit_id)")
      .eq("tenant_id",T).gte("created_at",since).order("created_at",{ascending:true}).limit(5000),
    sb.from("alerts").select("*,unit:units(name)").eq("tenant_id",T).is("resolved_at",null).order("updated_at",{ascending:false}).limit(200),
  ]);
  if(!$("#dash-units")) return;                       // navigated away meanwhile
  const prod=prodQ.data||[], feed=feedQ.data||[], lab=labQ.data||[], act=alertQ.data||[];
  const actCrit=act.filter(a=>a.severity==="critical").length;
  const yProd=prod.filter(r=>r.log_date===yesterday);
  const yMwh=yProd.reduce((s,r)=>s+(Number(r.kwh_el)||0),0)/1000;
  const yAvail=yProd.filter(r=>r.chp_hours!=null);
  $("#dash-stats").innerHTML =
    statTile("Ηλ. ενέργεια χθες", yProd.length ? yMwh.toFixed(1)+" MWh" : "—")+
    statTile("Διαθεσιμότητα ΣΗΘ χθες", yAvail.length ? Math.round(yAvail.reduce((s,r)=>s+Number(r.chp_hours),0)/(yAvail.length*24)*100)+"%" : "—")+
    statTile("Ενεργές ειδοποιήσεις", act.length, actCrit?'var(--high)':(act.length?'var(--warn)':'var(--ok)'))+
    statTile("Κρίσιμες", actCrit, actCrit?'var(--high)':'var(--ok)');

  const cards=state.units.map(u=>{
    const P=prod.filter(r=>r.unit_id===u.id), last=P[P.length-1], prevP=P[P.length-2];
    const F=feed.filter(d=>d.unit_id===u.id), lf=F[F.length-1];
    const A=act.filter(a=>a.unit_id===u.id), groups=diagnose(A);
    const sev=A.some(a=>a.severity==="critical")?"crit":A.length?"warn":"ok";
    const light={crit:["●","Κρίσιμο"],warn:["●","Προσοχή"],ok:["●","Κανονικά"]}[sev];
    const when=d=>d===yesterday?"χθες":d===today?"σήμερα":fmtDate(d);
    const kp=(k,v,sub,st)=>`<div class="kp"><div class="k">${k}</div><div class="v"${st?` style="color:${stColor(st)}"`:""}>${v}</div>${sub?`<div class="s">${sub}</div>`:""}</div>`;
    const ch4St=last&&last.ch4_pct!=null ? (last.ch4_pct<45?"crit":last.ch4_pct<50?"warn":"ok") : null;
    const chpSt=last&&last.chp_hours!=null&&!last.planned_stop ? (last.chp_hours<16?"crit":last.chp_hours<20?"warn":"ok") : null;
    const kpis = kp("Ηλ. ενέργεια", last&&last.kwh_el!=null ? (Number(last.kwh_el)/1000).toFixed(1)+" MWh" : "—", last?when(last.log_date):"")
      + kp("Ώρες ΣΗΘ", last&&last.chp_hours!=null ? fmtNum(last.chp_hours)+" h" : "—", last&&last.planned_stop?"🔧 προγρ. στάση":(last&&Number(last.flare_hours)>0?`πυρσός ${fmtNum(last.flare_hours)} h`:""), chpSt)
      + kp("CH₄", last&&last.ch4_pct!=null ? fmtNum(last.ch4_pct)+"%" : "—", last&&prevP ? trendArrow(Number(last.ch4_pct),Number(prevP.ch4_pct),1) : "", ch4St)
      + kp("Θερμοκρασία", last&&last.digester_temp_c!=null ? fmtNum(last.digester_temp_c)+" °C" : "—", last&&prevP&&last.digester_temp_c!=null ? trendArrow(Number(last.digester_temp_c),Number(prevP.digester_temp_c),1) : "ημερήσια ένδειξη")
      + kp("OLR", lf&&lf.olr!=null ? Number(lf.olr).toFixed(2) : "—", lf?`kg VS/m³·d · ${when(lf.feed_date)}`:"", lf&&lf.olr!=null?olrState(+lf.olr):null)
      + kp("HRT", lf&&lf.hrt!=null ? Number(lf.hrt).toFixed(0)+" ημ." : "—", lf?`${fmtNum(lf.mass_t)} t/ημ`:"", lf&&lf.hrt!=null?hrtState(+lf.hrt):null);
    const tsOf=a=>new Date(a.measured_at||a.created_at).getTime();
    const labRows=TODAY_LAB.map(([code,lbl,dec])=>{
      const L=lab.filter(a=>a.parameter&&a.parameter.code===code&&a.sample&&a.sample.unit_id===u.id&&a.value!=null).map(a=>({t:tsOf(a),v:Number(a.value),p:a.parameter})).sort((a,b)=>a.t-b.t);
      if(!L.length) return "";
      const cur=L[L.length-1], prev=L[L.length-2], st=rangeState(cur.v,cur.p), fmt=v=>Number(v.toFixed(dec)).toLocaleString("el-GR");
      return `<tr data-code="${code}"><th>${lbl}</th><td class="num"><span style="color:${stColor(st)}">${st==="crit"||st==="warn"?"⚠ ":""}${fmt(cur.v)}</span> ${trendArrow(cur.v,prev&&prev.v,dec)}</td>`
        + `<td>${sparkline(L,{min:cur.p.ideal_min,max:cur.p.ideal_max,label:lbl,unit:cur.p.default_unit,fmt,color:stColor(st)})}</td></tr>`;
    }).join("");
    const dailyRows=[["CH₄ παραγωγής","ch4_pct",1,50,null,"%",8],["Θερμοκρασία","digester_temp_c",1,null,null,"°C",4]].map(([lbl,k,dec,mn,mx,un,minSpan])=>{
      const L=P.filter(r=>r[k]!=null).map(r=>({t:new Date(r.log_date+"T12:00:00").getTime(),v:Number(r[k])}));
      return L.length>1 ? `<tr><th>${lbl}</th><td class="num small muted">ημερήσιο</td><td>${sparkline(L,{min:mn,max:mx,minSpan,label:lbl,unit:un,fmt:v=>Number(v.toFixed(dec)).toLocaleString("el-GR")})}</td></tr>` : "";
    }).join("");
    const missing=[];
    if(!P.some(r=>r.log_date===yesterday)) missing.push(`Δεν καταχωρίστηκε παραγωγή για χθες (${fmtDate(yesterday)}).`);
    if(new Date().getHours()>=10 && !F.some(d=>d.feed_date===today)) missing.push("Δεν έχει καταχωριστεί η σημερινή τροφοδοσία.");
    const issues=groups.map(g=>`<details class="issue ${g.sev}"><summary>${g.sev==="critical"?"⛔":"⚠"} <b>${esc(g.title)}</b> <span class="muted">· ${g.items.length} ${g.items.length===1?"ένδειξη":"ενδείξεις"}</span></summary>`
      + (g.hint?`<div class="small" style="margin:6px 0">${esc(g.hint)}</div>`:"")
      + `<ul>${g.items.map(a=>`<li>${sevBadge(a.severity)} ${esc(a.message||a.metric||"")}</li>`).join("")}</ul></details>`).join("");
    return `<section class="uc" data-unit="${u.id}"><div class="uc-head"><h2>${esc(u.name)}</h2>
        <span class="light ${sev}" role="status"><span aria-hidden="true">${light[0]}</span> ${light[1]}</span></div>
      ${groups.length?`<div class="uc-diag">${groups.slice(0,2).map(g=>`<span class="badge ${g.sev==="critical"?"high":"warnb"}">${esc(g.title)}</span>`).join(" ")}</div>`:""}
      <div class="uc-kpis">${kpis}</div>

/* ---- sample attachments (Supabase Storage: bucket "attachments") ---- */
async function loadFiles(sample){
  const body=$("#files-body"); if(!body) return;
  const { data, error } = await sb.from("files").select("*").eq("sample_id",sample.id).order("created_at",{ascending:false});
  if(error){ body.innerHTML=`<div class="empty">Σφάλμα: ${esc(error.message)}</div>`; return; }
  if(!(data||[]).length){ body.innerHTML=`<div class="empty">Κανένα αρχείο.</div>`; return; }
  body.innerHTML=table(
    ["Όνομα","Μέγεθος","Ημ/νία",""],
    data.map(f=>[esc(f.filename||"—"), f.size_bytes?Math.round(f.size_bytes/1024)+" KB":"—", fmtDate(f.created_at),
      `<span style="display:flex;gap:6px;justify-content:flex-end">
        <button class="btn ghost sm" data-open="${f.id}">Άνοιγμα</button>
        ${canWrite()?`<button class="btn ghost sm danger" data-delf="${f.id}">✕</button>`:""}</span>`])
  );
  (data||[]).forEach(f=>{
    const o=$(`#files-body [data-open="${f.id}"]`); if(o) o.onclick=()=>openFile(f);
    const d=$(`#files-body [data-delf="${f.id}"]`); if(d) d.onclick=()=>deleteFile(sample,f);
  });
}
async function uploadFile(sample, file){
  if(!file) return;
  if(file.size>15*1024*1024) return toast("Το αρχείο ξεπερνά τα 15MB.");
  const safe=file.name.replace(/[^\w.\-]+/g,"_");
  const path=`${state.tenantId}/${sample.id}/${Date.now()}_${safe}`;
  toast("Μεταφόρτωση…");
  const { error:ue } = await sb.storage.from("attachments").upload(path, file, {contentType:file.type||undefined});
  if(ue) return toast("Σφάλμα μεταφόρτωσης: "+ue.message);
  const { error:ie } = await sb.from("files").insert({
    tenant_id:state.tenantId, sample_id:sample.id, storage_path:path,
    filename:file.name, mime:file.type||null, size_bytes:file.size, uploaded_by:state.profile.id
  });
  if(ie){ await sb.storage.from("attachments").remove([path]); return toast("Σφάλμα: "+ie.message); }
  toast("Μεταφορτώθηκε"); loadFiles(sample);
}
async function openFile(f){
  const { data, error } = await sb.storage.from("attachments").createSignedUrl(f.storage_path, 120);
  if(error) return toast("Σφάλμα: "+error.message);
  window.open(data.signedUrl, "_blank");
}
async function deleteFile(sample, f){
  if(!confirm(`Διαγραφή «${f.filename}»;`)) return;
  await sb.storage.from("attachments").remove([f.storage_path]);
  const { error } = await sb.from("files").delete().eq("id",f.id);
  if(error) return toast("Σφάλμα: "+error.message);
  toast("Διαγράφηκε"); loadFiles(sample);
}
function renderAnalyses(an){
  const body=$("#an-body");
  if(!an.length){ body.innerHTML=`<div class="empty">Καμία ανάλυση ακόμα.</div>`; return; }
  body.innerHTML = table(
    ["Παράμετρος","Τιμή","Ιδανικό","Κατάσταση","Μέθοδος",""],
    an.map(a=>{
      const p=a.parameter||{}, st=rangeOf(a.value,p);
      const ideal=(p.ideal_min!=null||p.ideal_max!=null)?`<span class="ideal">${p.ideal_min??"−∞"} – ${p.ideal_max??"+∞"}</span>`:"—";
      return [esc(p.label_el||p.code||"—"), `<b>${esc(a.value)}</b> ${esc(a.unit||"")}`, ideal, rangeBadge(st), esc(a.method||"—"),
        canWrite()?`<button class="btn ghost sm danger" data-del="${a.id}">✕</button>`:""];
    })
  );
  $$("#an-body [data-del]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Διαγραφή ανάλυσης;"))return;
    const {error}=await sb.from("analyses").delete().eq("id",b.dataset.del);

function modal(title, bodyNode, onSave, saveLabel="Αποθήκευση"){
  const root=$("#modal-root");
  const close=()=>root.innerHTML="";
  const saveBtn=el("button",{class:"btn primary"},saveLabel);
  const ov=el("div",{class:"overlay",onclick:e=>{if(e.target===ov)close();}},
    el("div",{class:"modal card"},
      el("div",{class:"head"}, el("h3",{},title), el("button",{class:"btn ghost sm",onclick:close},"✕")),
      el("div",{class:"pad"}, bodyNode),
      el("div",{class:"foot"}, el("button",{class:"btn",onclick:close},"Άκυρο"), saveBtn)));
  saveBtn.onclick=async()=>{ saveBtn.disabled=true; try{ await onSave(close);}finally{saveBtn.disabled=false;} };
  root.innerHTML=""; root.append(ov);
}

async function runMonthly(){
  const m=$("#mo-month").value || localMonth();
  const [y,mo]=m.split("-").map(Number);
  const from=new Date(Date.UTC(y,mo-1,1)).toISOString();
  const to=new Date(Date.UTC(y,mo,1)).toISOString();
  const res=$("#mo-result"); res.innerHTML=`<div class="panel"><div class="empty">Υπολογισμός…</div></div>`;
  const { data } = await sb.from("analyses")
    .select("value,parameter:parameters(code,label_el,ideal_min,ideal_max,default_unit),sample:samples!inner(unit_id,unit:units(name))")
    .eq("tenant_id",state.tenantId).gte("created_at",from).lt("created_at",to).limit(10000);
  const rows=data||[];
  if(!rows.length){ res.innerHTML=`<div class="panel"><div class="empty">Καμία μέτρηση για ${esc(m)}.</div></div>`; state._monthly=null; return; }
  const g={};
  rows.forEach(a=>{
    const un=a.sample?.unit?.name||"—", pl=a.parameter?.label_el||a.parameter?.code||"—", key=un+"||"+pl;
    const o=g[key]||(g[key]={unit:un,param:pl,unitm:a.parameter?.default_unit||"",n:0,sum:0,min:Infinity,max:-Infinity,out:0,p:a.parameter});
    if(a.value!=null){ o.n++; o.sum+=+a.value; o.min=Math.min(o.min,a.value); o.max=Math.max(o.max,a.value); if(rangeOf(a.value,a.parameter||{})==='low'||rangeOf(a.value,a.parameter||{})==='high') o.out++; }
  });
  const list=Object.values(g).sort((a,b)=> a.unit<b.unit?-1:a.unit>b.unit?1:(a.param<b.param?-1:1));
  state._monthly={month:m, tenant:((state.tenants||[]).find(x=>x.id===state.tenantId)||{}).name||"",
    rows:list.map(o=>({Μονάδα:o.unit,Παράμετρος:o.param,Μονάδα_μέτρησης:o.unitm,Πλήθος:o.n,
      "Μ.Ο.":o.n?+(o.sum/o.n).toFixed(2):null,Ελάχιστο:o.n?+o.min.toFixed(2):null,Μέγιστο:o.n?+o.max.toFixed(2):null,Εκτός:o.out}))};
  res.innerHTML=`<div class="panel"><h3>Αναφορά μηνός ${esc(m)} — ${rows.length} μετρήσεις</h3><div class="body">${
    table(["Μονάδα","Παράμετρος","Μον.","Πλήθος","Μ.Ο.","Ελάχ.","Μέγ.","Εκτός"],
      list.map(o=>[esc(o.unit),esc(o.param),esc(o.unitm||"—"),o.n,o.n?(o.sum/o.n).toFixed(2):"—",
        o.n?o.min.toFixed(2):"—",o.n?o.max.toFixed(2):"—",
        `<b style="color:${o.out>0?'var(--high)':'var(--ok)'}">${o.out}</b>`]))
  }</div></div>`;
}

async function runReport(){
  const from=$("#r-from").value, to=$("#r-to").value, unit=$("#r-unit").value;
  const res=$("#r-result"); res.innerHTML=`<div class="panel"><div class="empty">Υπολογισμός…</div></div>`;
  let q = sb.from("analyses")
    .select("value,unit,measured_at,created_at,parameter:parameters(code,label_el,ideal_min,ideal_max),sample:samples!inner(code,taken_at,unit_id,unit:units(name))")
    .eq("tenant_id",state.tenantId).order("created_at",{ascending:false}).limit(5000);
  if(from) q=q.gte("created_at",from);
  if(to)   q=q.lte("created_at",to+"T23:59:59");
  const { data, error } = await q;
  if(error){ res.innerHTML=`<div class="panel"><div class="empty">Σφάλμα: ${esc(error.message)}</div></div>`; return; }
  let rows=(data||[]);
  if(unit) rows=rows.filter(a=>a.sample?.unit_id===unit);
  if(!rows.length){ res.innerHTML=`<div class="panel"><div class="empty">Δεν βρέθηκαν μετρήσεις στο διάστημα.</div></div>`; return; }

  // aggregate per parameter
  const agg={};
  rows.forEach(a=>{
    const p=a.parameter||{}; const code=p.code||"—";
    const g=agg[code]||(agg[code]={label:p.label_el||code,n:0,sum:0,min:Infinity,max:-Infinity,out:0,ideal:`${p.ideal_min??"−∞"} – ${p.ideal_max??"+∞"}`});
    if(a.value!=null){ g.n++; g.sum+=Number(a.value); g.min=Math.min(g.min,a.value); g.max=Math.max(g.max,a.value);
      if(rangeOf(a.value,p)!=="ok"&&rangeOf(a.value,p)!=="na") g.out++; }
  });
  const summary=Object.values(agg).map(g=>({
    Παράμετρος:g.label, Πλήθος:g.n, "Μ.Ο.":g.n?+(g.sum/g.n).toFixed(2):null,
    Ελάχιστο:g.n?+g.min.toFixed(2):null, Μέγιστο:g.n?+g.max.toFixed(2):null,
    "Ιδανικό":g.ideal, "Εκτός":g.out, "% Εκτός":g.n?Math.round(100*g.out/g.n)+"%":"0%"
  }));
  state._report={rows,summary,from,to};

  res.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px">
      <div class="small muted">${rows.length} μετρήσεις · ${summary.length} παράμετροι</div>
      <div style="display:flex;gap:10px">
        <button class="btn" id="exp-csv">⤓ CSV</button>
        <button class="btn primary" id="exp-xlsx">⤓ Excel</button>
      </div>
    </div>
    <div class="panel" style="margin-bottom:16px"><h3>Σύνοψη ανά παράμετρο</h3><div class="body">${
      table(["Παράμετρος","Πλήθος","Μ.Ο.","Ελάχ.","Μέγ.","Ιδανικό","Εκτός","% Εκτός"],
        summary.map(s=>[esc(s.Παράμετρος),s.Πλήθος,s["Μ.Ο."]??"—",s.Ελάχιστο??"—",s.Μέγιστο??"—",
          `<span class="ideal">${esc(s.Ιδανικό)}</span>`,s.Εκτός,
          `<b style="color:${parseInt(s["% Εκτός"])>0?'var(--high)':'var(--ok)'}">${s["% Εκτός"]}</b>`]))
    }</div></div>`;
  $("#exp-xlsx").onclick=()=>exportXlsx();
  $("#exp-csv").onclick=()=>exportCsv();
}
function reportDetailRows(){
  return state._report.rows.map(a=>({
    Ημερομηνία:fmtDate(a.created_at), Μονάδα:a.sample?.unit?.name||"", Δείγμα:a.sample?.code||"",
    Παράμετρος:a.parameter?.label_el||a.parameter?.code||"", Τιμή:a.value, Μονάδα_μέτρησης:a.unit||"",
    Κατάσταση:({ok:"ιδανικό",low:"χαμηλό",high:"υψηλό",na:"—"})[rangeOf(a.value,a.parameter||{})]
  }));
}
function exportXlsx(){
  if(!window.XLSX) return toast("Το Excel library δεν φόρτωσε.");
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state._report.summary), "Σύνοψη");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(reportDetailRows()), "Αναλυτικά");
  const name=`BioGas_report_${state._report.from||"all"}_${state._report.to||""}.xlsx`;

function exportCsv(){
  const rows=reportDetailRows();
  const heads=Object.keys(rows[0]);
  const csv=[heads.join(","),...rows.map(r=>heads.map(h=>{
    const v=r[h]==null?"":String(r[h]); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
  }).join(","))].join("\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
  const a=el("a",{href:URL.createObjectURL(blob),download:`BioGas_report_${state._report.from||"all"}.csv`});
  document.body.append(a); a.click(); a.remove(); toast("CSV κατέβηκε");
}

/* ============================ Security / MFA (TOTP) ============================ */
async function renderSecurity(){
  const main=$("#main");
  main.innerHTML=`<div class="page-head"><div><h1 class="page-title">Ασφάλεια</h1><div class="sub">Έλεγχος ταυτότητας 2 βημάτων (2FA)</div></div></div>
    <div class="panel"><h3>Authenticator (TOTP)</h3><div class="body" id="sec-body"><div class="empty">Φόρτωση…</div></div></div>`;
  await loadFactors();
}
async function loadFactors(){
  const body=$("#sec-body"); let factors=[];
  try{ const { data } = await sb.auth.mfa.listFactors(); factors=(data&&data.totp)||[]; }
  catch(e){ body.innerHTML=`<div class="empty">Το MFA δεν είναι διαθέσιμο εδώ: ${esc(e.message||String(e))}</div>`; return; }
  if(!factors.length){
    body.innerHTML=`<div style="padding:18px">
      <p class="muted">Δεν έχεις ενεργό 2FA. Πρόσθεσε εφαρμογή authenticator για επιπλέον ασφάλεια στη σύνδεση.</p>
      <button class="btn primary" id="btn-enroll">Ενεργοποίηση 2FA</button></div>`;
    $("#btn-enroll").onclick=enrollMfa;
  } else {
    body.innerHTML=table(["Συσκευή","Κατάσταση",""],
      factors.map(f=>[esc(f.friendly_name||"Authenticator"),
        `<span class="badge ${f.status==='verified'?'ok':'st'}">${f.status==='verified'?'ενεργό':esc(f.status)}</span>`,
        `<button class="btn ghost sm danger" data-un="${f.id}">Αφαίρεση</button>`]));
    $$("#sec-body [data-un]").forEach(b=>b.onclick=async()=>{
      if(!confirm("Αφαίρεση του 2FA;"))return;
      const {error}=await sb.auth.mfa.unenroll({ factorId:b.dataset.un });
      if(error)return toast("Σφάλμα: "+error.message); toast("Αφαιρέθηκε"); loadFactors();
    });
  }
}
async function enrollMfa(){
  const { data, error } = await sb.auth.mfa.enroll({ factorType:"totp", friendlyName:"Authenticator" });
  if(error) return toast("Σφάλμα: "+error.message);
  const factorId=data.id, qr=data.totp.qr_code, secret=data.totp.secret;
  const body=el("div");
  const qrHtml=(typeof qr==="string" && qr.trim().startsWith("<svg")) ? qr : `<img src="${qr}" alt="QR" style="width:180px;height:180px">`;
  body.innerHTML=`<p class="small muted">Σάρωσε τον κωδικό με Google Authenticator / Authy, μετά βάλε τον 6-ψήφιο κωδικό.</p>
    <div style="text-align:center;margin:12px 0">${qrHtml}</div>
    <p class="small">Χειροκίνητο κλειδί: <code style="user-select:all">${esc(secret)}</code></p>
    <div class="field"><label>Κωδικός επιβεβαίωσης</label>
      <input class="input" id="en-code" inputmode="numeric" maxlength="6" style="letter-spacing:5px;text-align:center;font-size:20px"></div>
    <div id="en-msg"></div>`;
  modal("Ενεργοποίηση 2FA", body, async close=>{
    const code=$("#en-code").value.trim();
    const { data:ch, error:ce } = await sb.auth.mfa.challenge({ factorId });
    if(ce){ $("#en-msg").innerHTML=`<div class="msg err">${esc(ce.message)}</div>`; return; }
    const { error:ve } = await sb.auth.mfa.verify({ factorId, challengeId:ch.id, code });
    if(ve){ $("#en-msg").innerHTML=`<div class="msg err">Λάθος κωδικός.</div>`; return; }
    close(); toast("Το 2FA ενεργοποιήθηκε"); loadFactors();
  },"Επιβεβαίωση");
}

function fmtNum(n){ return n==null||n==="" ? "—" : Number(n).toLocaleString("el-GR",{maximumFractionDigits:1}); }
async function renderProduction(){
  const main=$("#main");
  const defM=localMonth();
  main.innerHTML=`<div class="page-head">
      <div><h1 class="page-title">Παραγωγή</h1><div class="sub">Ημερήσιο log λειτουργίας & δείκτες απόδοσης (KPIs)</div></div>
      <div style="display:flex;gap:10px;align-items:flex-end">
        <div class="field" style="margin:0"><label>Μήνας</label><input class="input" id="pr-month" type="month" value="${defM}"></div>
        <div class="field" style="margin:0"><label>Μονάδα</label><select class="input" id="pr-unit"><option value="">Όλες</option></select></div>

      </div></div>
    <div class="stats" id="pr-stats"></div>
    <div class="panel"><div class="body" id="pr-body"><div class="empty">Φόρτωση…</div></div></div>`;
  const pu=$("#pr-unit"); state.units.forEach(u=>pu.append(el("option",{value:u.id},u.name)));
  $("#pr-month").onchange=loadProduction; $("#pr-unit").onchange=loadProduction;
  $("#pr-xlsx").onclick=exportProductionXlsx;
  if(canWrite()) $("#pr-new").onclick=()=>productionForm();
  loadProduction();
}
async function loadProduction(){
  const m=$("#pr-month").value||localMonth(), unit=$("#pr-unit").value;
  const [y,mo]=m.split("-").map(Number);
  const from=new Date(Date.UTC(y,mo-1,1)).toISOString().slice(0,10);
  const to=new Date(Date.UTC(y,mo,1)).toISOString().slice(0,10);
  let q=sb.from("production").select("*,unit:units(name)").eq("tenant_id",state.tenantId)
    .gte("log_date",from).lt("log_date",to).order("log_date",{ascending:false}).limit(1000);
  if(unit) q=q.eq("unit_id",unit);
  const { data, error }=await q;
  const body=$("#pr-body");
  if(error){ body.innerHTML=`<div class="empty">Σφάλμα: ${esc(error.message)}</div>`; return; }
  const rows=data||[]; state._prod={rows,month:m};
  const sum=(k)=>rows.reduce((s,r)=>s+(Number(r[k])||0),0);
  const mwh=sum("kwh_el")/1000, feed=sum("feedstock_t"), gas=sum("biogas_m3");
  const ch4r=rows.filter(r=>r.ch4_pct!=null);
  const avgch4=ch4r.length?ch4r.reduce((s,r)=>s+Number(r.ch4_pct),0)/ch4r.length:null;
  const chpAvail=rows.length?(sum("chp_hours")/(rows.length*24))*100:null;
  const spec=feed>0?gas/feed:null;
  $("#pr-stats").innerHTML=
    statTile("Ηλ. ενέργεια", mwh.toFixed(1)+" MWh")+
    statTile("Μ.Ο. CH₄", avgch4!=null?avgch4.toFixed(1)+"%":"—", (avgch4!=null&&avgch4<50)?"var(--high)":"var(--ink)")+
    statTile("Διαθεσιμότητα ΣΗΘ", chpAvail!=null?Math.round(chpAvail)+"%":"—", (chpAvail!=null&&chpAvail<85)?"var(--warn)":"var(--ok)")+
    statTile("Ειδική απόδοση", spec!=null?spec.toFixed(0)+" m³/t":"—")+
    statTile("Τροφοδοσία", feed.toFixed(1)+" t");
  body.innerHTML=rows.length? table(
    ["Ημ/νία","Μονάδα","Τροφ. (t)","Βιοαέριο (m³)","CH₄ %","kWh el","Ώρες ΣΗΘ","Ώρες πυρσού","°C",""],
    rows.map(r=>[fmtDate(r.log_date)+(r.notes?` <span title="${esc(r.notes)}" aria-label="Σημείωση: ${esc(r.notes)}">📝</span>`:""),esc(r.unit?.name||"—"),fmtNum(r.feedstock_t),fmtNum(r.biogas_m3),
      r.ch4_pct!=null?`<span class="badge ${r.ch4_pct<50?'high':'ok'}">${r.ch4_pct}</span>`:"—",
      fmtNum(r.kwh_el),fmtNum(r.chp_hours)+(r.planned_stop?` <span class="badge st" title="Προγραμματισμένη στάση">🔧</span>`:""),fmtNum(r.flare_hours),fmtNum(r.digester_temp_c),

// Physical limits of a daily production log — mirrored by the CHECK constraints of
// migration 0010 so a typo (CH₄ 531 %, 31 h, −500 m³) never reaches the KPIs.
function validateProduction(p){
  const err=[], u=state.units.find(x=>x.id===p.unit_id);
  const nonNeg={feedstock_t:"Τροφοδοσία",biogas_m3:"Βιοαέριο",kwh_el:"kWh ηλεκτρ.",kwh_th:"kWh θερμ."};
  if(!p.log_date) err.push("Συμπλήρωσε ημερομηνία.");
  else if(p.log_date>localDate()) err.push("Η ημερομηνία είναι στο μέλλον.");
  if(state.units.length && !p.unit_id) err.push("Επίλεξε μονάδα / χωνευτή.");
  for(const [k,l] of Object.entries(nonNeg)) if(p[k]!=null && p[k]<0) err.push(`${l}: δεν μπορεί να είναι αρνητικό.`);
  if(p.ch4_pct!=null && (p.ch4_pct<0||p.ch4_pct>100)) err.push(`CH₄ ${fmtNum(p.ch4_pct)}%: πρέπει να είναι 0–100 %.`);
  if(p.chp_hours!=null && (p.chp_hours<0||p.chp_hours>24)) err.push(`Ώρες ΣΗΘ ${fmtNum(p.chp_hours)}: πρέπει να είναι 0–24.`);
  if(p.flare_hours!=null && (p.flare_hours<0||p.flare_hours>24)) err.push(`Ώρες πυρσού ${fmtNum(p.flare_hours)}: πρέπει να είναι 0–24.`);
  if(p.digester_temp_c!=null && (p.digester_temp_c<0||p.digester_temp_c>80)) err.push(`Θερμοκρασία ${fmtNum(p.digester_temp_c)} °C: πρέπει να είναι 0–80.`);
  const cap=Number(u&&u.capacity_kw)||0;
  if(cap>0 && p.kwh_el!=null && p.kwh_el>cap*24*1.05)
    err.push(`kWh ηλεκτρ. ${fmtNum(p.kwh_el)}: πάνω από το μέγιστο δυνατό της ΣΗΘ (${fmtNum(cap)} kWel × 24 h ≈ ${fmtNum(Math.round(cap*24))} kWh).`);
  return err;
}

const fsVs  = f => (Number(f&&f.ts_pct)||0)/100 * (Number(f&&f.vs_pct)||0)/100;   // t VS per t fresh

const stColor = st => ({ok:"var(--ok)",warn:"var(--warn)",crit:"var(--high)",low:"var(--low)"})[st]||"var(--ink)";
function olrState(v){ if(v==null) return "na"; if(v>5) return "crit"; if(v>4) return "warn"; if(v<1.5) return "low"; return "ok"; }

  if(a.resolved_at) return `<span class="badge st">Επιλύθηκε</span>`;

}

function fmtDateTime(d){ return d ? new Date(d).toLocaleString("el-GR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "—"; }
async function refreshAlertBadge(){
  const b=$("#alert-badge"); if(!b||!sb||!state.tenantId) return;
  try{
    const { data } = await sb.from("alerts").select("severity").eq("tenant_id",state.tenantId)
      .is("resolved_at",null).is("acknowledged_at",null).limit(500);

  await loadRecipes(); renderRecipeSelect();
  if(!P.lines.length && P.unit_id) await loadLatestFeedingAsBasis();
  loadUnitState(); drawLines(); loadPrev(); loadFeedingLog();
}
// Start the planner from the plant's most recent feeding (the usual case: small daily adjustments).
async function loadLatestFeedingAsBasis(){
  const P=state.planner, unit=P.unit_id, info=()=>$("#pl-basis");
  if(info()) info().textContent="";
  const { data:last } = await sb.from("feeding_daily").select("feed_date").eq("tenant_id",state.tenantId)
    .eq("unit_id",unit).lte("feed_date",P.date).order("feed_date",{ascending:false}).limit(1);
  if(P.unit_id!==unit) return;                         // user switched digester meanwhile
  if(!last || !last[0]){ P.lines=[];
    if(info()) info().textContent=`Δεν υπάρχει προηγούμενη τροφοδοσία για «${unitName(unit)}» — πρόσθεσε υποστρώματα ή φόρτωσε συνταγή.`; return; }
  const { data } = await sb.from("feeding").select("feedstock_id,mass_t").eq("tenant_id",state.tenantId)
    .eq("unit_id",unit).eq("feed_date",last[0].feed_date);
  if(P.unit_id!==unit) return;
  P.lines=(data||[]).map(r=>({feedstock_id:r.feedstock_id, mass_t:r.mass_t}));
  if(info()) info().textContent=`Βάση: τροφοδοσία «${unitName(unit)}» ${fmtDate(last[0].feed_date)} — προσάρμοσε και καταχώρισε για την επιλεγμένη ημέρα.`;
}
// Digester state next to OLR/HRT (operator review Top-10 #6): latest FOS/TAC, VFA, pH with trend
// arrows and the open stability alarms. An unstable digester changes the planner's advice.
const STABILITY_CODES=[["fos_tac","FOS/TAC",2],["vfa","VFA",0],["ph_dig","pH",2]];
async function loadUnitState(){
  const P=state.planner, unit=P.unit_id, box=$("#pl-state"); P.stab=null;
  if(!unit){ if(box) box.innerHTML=""; return; }
  const since=daysAgoDate(60);
  const [{ data:an }, { data:al }] = await Promise.all([
    sb.from("analyses").select("value,measured_at,created_at,parameter:parameters(code,ideal_min,ideal_max),sample:samples(unit_id)")
      .eq("tenant_id",state.tenantId).gte("created_at",since).order("created_at",{ascending:true}).limit(3000),
    sb.from("alerts").select("metric,severity,message").eq("tenant_id",state.tenantId).eq("unit_id",unit).is("resolved_at",null).limit(100)]);
  if(P.unit_id!==unit) return;
  const chips=[], bad=[];
  STABILITY_CODES.forEach(([code,lbl,dec])=>{
    const L=(an||[]).filter(a=>a.parameter&&a.parameter.code===code&&a.sample&&a.sample.unit_id===unit&&a.value!=null)
      .sort((a,b)=>String(a.measured_at||a.created_at).localeCompare(String(b.measured_at||b.created_at)));
    if(!L.length) return;
    const cur=L[L.length-1], prev=L[L.length-2], v=Number(cur.value), st=rangeState(v,cur.parameter);
    if(st==="warn"||st==="crit") bad.push(lbl);
    chips.push(`<span class="chip ${st}">${lbl} <b>${Number(v.toFixed(dec)).toLocaleString("el-GR")}</b>${trendArrow(v,prev&&Number(prev.value),dec)} <span class="muted">· ${fmtDate(cur.measured_at||cur.created_at)}</span></span>`);
  });
  const stab=(al||[]).filter(a=>/^FOS\/TAC|Πτητικά οξέα|^pH|^CH₄ % \(τάση\)/.test(a.metric||""));
  stab.forEach(a=>{ if(/τάση/.test(a.metric) && !bad.includes(a.metric)) bad.push(a.metric); });
  P.stab={unstable:bad.length>0, reasons:bad};
  if(box) box.innerHTML = chips.length||stab.length
    ? `<div class="small muted" style="margin-bottom:4px">Κατάσταση χωνευτή (τελευταίες αναλύσεις):</div>${chips.join(" ")}`
      + (P.stab.unstable?` <span class="badge high">Ασταθής: ${esc(bad.join(", "))}</span>`:` <span class="badge ok">Σταθερός</span>`)
    : `<span class="small muted">Χωρίς πρόσφατες αναλύσεις σταθερότητας για αυτόν τον χωνευτή.</span>`;
  updatePlannerCalc();
}
const fsEasy = f => f && ["food_waste","agro_industrial"].includes(f.category);   // fast-acidifying substrates
function drawLines(){
  const P=state.planner, box=$("#pl-lines"); if(!box) return;
  P.lines.forEach(l=>{ if(!l.feedstock_id && state.feedstocks[0]) l.feedstock_id=state.feedstocks[0].id; });
  if(!P.lines.length){ box.innerHTML=`<div class="empty" style="padding:18px">Πρόσθεσε υποστρώματα ή φόρτωσε μια συνταγή.</div>`; updatePlannerCalc(); return; }
  const opts=sel=>{
    let o=state.feedstocks.map(f=>`<option value="${f.id}"${f.id===sel?" selected":""}>${esc(f.name)}</option>`).join("");
    if(sel && !state.feedstocks.some(f=>f.id===sel)){ const f=state.feedstockById[sel]; o=`<option value="${sel}" selected>${esc(f?f.name:"(άγνωστο)")} — ανενεργό</option>`+o; }
    return o;
  };
  box.innerHTML=`<table class="grid-entry"><thead><tr><th>Υπόστρωμα</th><th style="width:130px">t / ημέρα</th><th>VS (t)</th><th>CH₄ (m³)</th><th>Κόστος (€)</th><th></th></tr></thead><tbody>${
    P.lines.map((l,i)=>`<tr>
      <td><select class="input pl-fs" data-i="${i}">${opts(l.feedstock_id)}</select></td>
      <td><input class="input pl-mass" data-i="${i}" type="number" step="any" min="0" value="${l.mass_t??""}"></td>
      <td class="pl-c-vs"></td><td class="pl-c-ch4"></td><td class="pl-c-cost"></td>
      <td><button class="btn ghost sm danger pl-del" data-i="${i}" title="Αφαίρεση">✕</button></td></tr>`).join("")}</tbody></table>`;
  box.querySelectorAll(".pl-fs").forEach(s=>s.onchange=()=>{ P.lines[+s.dataset.i].feedstock_id=s.value; updatePlannerCalc(); });
  box.querySelectorAll(".pl-mass").forEach(s=>s.oninput=()=>{ P.lines[+s.dataset.i].mass_t=s.value; updatePlannerCalc(); });
  box.querySelectorAll(".pl-del").forEach(b=>b.onclick=()=>{ P.lines.splice(+b.dataset.i,1); drawLines(); });
  updatePlannerCalc();
}
function plannerCalc(){
  const P=state.planner, u=state.units.find(x=>x.id===P.unit_id)||{};
  let mass=0, vs=0, ch4=0, cost=0, cnW=0, cnV=0;
  const per=P.lines.map(l=>{
    const f=state.feedstockById[l.feedstock_id]||{}, m=Math.max(Number(l.mass_t)||0,0);
    const v=m*fsVs(f), c=m*fsCh4(f), co=m*(Number(f.price_eur_t)||0);
    mass+=m; vs+=v; ch4+=c; cost+=co;
    if(f.cn_ratio!=null && v>0){ cnW+=v*Number(f.cn_ratio); cnV+=v; }
    return {v,c,co};
  });
  const vol=Number(u.digester_m3)||0, cap=Number(u.capacity_kw)||0;
  const olr=vol>0 ? vs*1000/vol : null, hrt=(vol>0&&mass>0) ? vol/mass : null;
  const kwh=ch4*CH4_KWH*ETA_EL, cover=(cap>0&&mass>0) ? kwh/(cap*24)*100 : null, cn=cnV>0 ? cnW/cnV : null;
  return {per,mass,vs,ch4,cost,olr,hrt,kwh,cover,cn,unit:u};
}
function updatePlannerCalc(){
  const k=plannerCalc(), P=state.planner, u=k.unit;
  $$("#pl-lines tbody tr").forEach((tr,i)=>{ const p=k.per[i]; if(!p) return;
    tr.querySelector(".pl-c-vs").textContent=p.v.toFixed(2);
    tr.querySelector(".pl-c-ch4").textContent=fmtNum(Math.round(p.c));
    tr.querySelector(".pl-c-cost").textContent=fmtNum(Math.round(p.co)); });
  const info=$("#pl-unitinfo");
  if(info) info.innerHTML = u.id ? `Χωνευτής <b>${fmtNum(u.digester_m3)} m³</b> · ΣΗΘ <b>${fmtNum(u.capacity_kw)} kWel</b> · η<sub>el</sub> ${Math.round(ETA_EL*100)}% (ενδεικτικό)`
    + (!(Number(u.digester_m3)>0) ? ` — <span style="color:var(--warn)">ορίστε όγκο χωνευτή στις «Μονάδες» για OLR/HRT</span>` : "") : "";
  const os=olrState(k.olr), hs=hrtState(k.hrt), cs=cnState(k.cn), vs=coverState(k.cover);
  const st=$("#pl-stats"); if(!st) return;
  st.innerHTML =
    statTile("Τροφοδοσία", fmtNum(k.mass)+" t/ημ")+
    statTile("Οργανική ουσία (VS)", k.vs.toFixed(2)+" t/ημ")+
    statTile("OLR (kg VS/m³·d)", k.olr!=null&&k.mass>0 ? k.olr.toFixed(2) : "—", stColor(k.mass>0?os:"na"))+
    statTile("HRT (ημέρες)", k.hrt!=null ? k.hrt.toFixed(0) : "—", stColor(hs))+
    statTile("Αναμ. CH₄", fmtNum(Math.round(k.ch4))+" m³/ημ")+
    statTile("Αναμ. ηλεκτρ.", fmtNum(Math.round(k.kwh))+" kWh/ημ")+
    statTile("Κάλυψη ΣΗΘ", k.cover!=null ? Math.round(k.cover)+"%" : "—", stColor(vs))+
    statTile("Κόστος", k.cost>=0 ? fmtNum(Math.round(k.cost))+" €/ημ" : "έσοδο "+fmtNum(Math.round(-k.cost))+" €", k.cost<0?"var(--ok)":"var(--ink)")+
    statTile("≈ C:N μίγματος", k.cn!=null ? k.cn.toFixed(0) : "—", stColor(cs));
  const w=[], notes=[];
  if(k.mass>0){
    if(os==="crit"||os==="warn") w.push(`<b>Υψηλό οργανικό φορτίο (OLR ${k.olr.toFixed(2)})</b> — πάνω από 4 kg VS/m³·d υπάρχει κίνδυνος υπερφόρτωσης και οξίνισης. Αύξησε τη φόρτιση σταδιακά (≤10%/εβδομάδα) και παρακολούθησε FOS/TAC.`);
    if(os==="low") w.push(`<b>Χαμηλό OLR (${k.olr.toFixed(2)})</b> — ο χωνευτής υποαξιοποιείται.`);
    if(hs==="crit"||hs==="warn") w.push(`<b>Μικρός χρόνος παραμονής (HRT ${k.hrt.toFixed(0)} ημ.)</b> — κάτω από 20 ημέρες κινδυνεύουν να «ξεπλυθούν» οι μεθανογόνοι μικροοργανισμοί.`);
    if(k.cn!=null && k.cn<15) w.push(`<b>Χαμηλό C:N (${k.cn.toFixed(0)})</b> — κίνδυνος αναστολής από αμμωνία (NH₃). Πρόσθεσε υπόστρωμα πλούσιο σε άνθρακα (π.χ. ενσίρωμα).`);
    if(k.cn!=null && k.cn>35) w.push(`<b>Υψηλό C:N (${k.cn.toFixed(0)})</b> — πιθανή έλλειψη αζώτου. Πρόσθεσε κοπριά.`);
    if(vs==="warn" && k.cover<90) w.push(`Η συνταγή καλύπτει <b>~${Math.round(k.cover)}%</b> του πλήρους φορτίου ΣΗΘ.`
      + (os==="warn"||os==="crit" ? ` Ο όγκος του χωνευτή είναι ο περιοριστικός παράγοντας — προτίμησε υποστρώματα με υψηλότερη απόδοση ανά τόνο VS αντί για περισσότερη μάζα.` : ""));
    if(vs==="warn" && k.cover>110) w.push(`Πλεόνασμα αερίου <b>~${Math.round(k.cover-100)}%</b> πάνω από την ισχύ ΣΗΘ — πιθανή καύση σε πυρσό.`);
    if(P.prev && P.prev.vs>0){ const ch=(k.vs-P.prev.vs)/P.prev.vs*100, unstable=!!(P.stab&&P.stab.unstable);
      const pct=`${ch>0?"+":""}${ch.toFixed(0)}% VS έναντι ${fmtDate(P.prev.date)}`;
      if(ch>10) w.push(unstable
        ? `<b>Αύξηση φόρτισης (${pct}) σε ασταθή χωνευτή</b> (${esc(P.stab.reasons.join(", "))}). Μην αυξάνεις πριν σταθεροποιηθούν FOS/TAC και VFA.`
        : `<b>Απότομη αύξηση φόρτισης (${pct})</b> — συστήνεται σταδιακή αύξηση (≤10%/εβδομάδα) με παρακολούθηση FOS/TAC.`);
      if(ch<-10){
        if(unstable){
          const easy=P.lines.map((l,i)=>({f:state.feedstockById[l.feedstock_id], c:(k.per[i]||{}).c||0})).filter(x=>fsEasy(x.f)&&x.c>0).sort((a,b)=>b.c-a.c);
          notes.push(`✓ <b>Μείωση φόρτισης (${pct})</b> — σωστή κίνηση για ασταθή χωνευτή (${esc(P.stab.reasons.join(", "))}). `
            + (easy.length ? `Κόψε πρώτα τα εύπεπτα / γρήγορα οξινιζόμενα: <b>${easy.map(x=>esc(x.f.name)).join(", ")}</b>. ` : "")
            + `Κράτα σταθερή την κοπριά (ρυθμιστική ικανότητα) και μέτρα FOS/TAC κάθε 2–3 ημέρες.`);
        } else notes.push(`Μείωση φόρτισης (${pct}): η παραγωγή αερίου θα πέσει αναλογικά. Γράψε την αιτία στο πεδίο σημείωσης.`);
      }
    }
  }
  $("#pl-warn").innerHTML = !k.mass ? "" : (w.length
    ? `<div class="hint warn">⚠ <b>Παρατηρήσεις</b><ul>${w.map(x=>`<li>${x}</li>`).join("")}</ul></div>`
    : `<div class="hint ok">✓ Η συνταγή είναι εντός των συνιστώμενων ορίων (OLR 1.5–4 kg VS/m³·d, HRT ≥ 20 ημ., C:N 15–35).</div>`)
    + (k.mass && notes.length ? `<div class="hint info" id="pl-info">${notes.join("<br>")}</div>` : "");
}
async function loadPrev(){

async function commitFeeding(){
  const P=state.planner, T=state.tenantId, lines=P.lines.filter(l=>l.feedstock_id && Number(l.mass_t)>0);
  if(!P.unit_id) return toast("Επίλεξε μονάδα.");
  if(!P.date) return toast("Επίλεξε ημερομηνία.");
  if(!lines.length) return toast("Πρόσθεσε τουλάχιστον ένα υπόστρωμα με ποσότητα.");
  const { count } = await sb.from("feeding").select("id",{count:"exact",head:true}).eq("tenant_id",T).eq("unit_id",P.unit_id).eq("feed_date",P.date);
  if(count && !confirm(`Υπάρχει ήδη τροφοδοσία για ${fmtDate(P.date)} (${unitName(P.unit_id)}) — αντικατάσταση;`)) return;
  const btn=$("#pl-commit"); if(btn) btn.disabled=true;
  const { data, error } = await sb.rpc("replace_feeding",{p_tenant:T, p_unit:P.unit_id, p_date:P.date,
    p_items:lines.map(l=>({feedstock_id:l.feedstock_id, mass_t:Number(l.mass_t)}))});
  if(btn) btn.disabled=false;
  if(error) return toast("Σφάλμα: "+error.message);

  const note=(P.note||"").trim();

async function loadFeedingLog(){
  const FL=state.feedLog, T=state.tenantId, body=$("#fl-body"); if(!body) return;
  const { from, to } = monthRange(FL.month);
  let q=sb.from("feeding_daily").select("*").eq("tenant_id",T).gte("feed_date",from).lt("feed_date",to).order("feed_date",{ascending:false}).limit(1000);
  let pq=sb.from("production").select("unit_id,log_date,biogas_m3,ch4_pct").eq("tenant_id",T).gte("log_date",from).lt("log_date",to).limit(2000);
  if(FL.unit){ q=q.eq("unit_id",FL.unit); pq=pq.eq("unit_id",FL.unit); }
  let nq=sb.from("feeding_notes").select("unit_id,feed_date,note").eq("tenant_id",T).gte("feed_date",from).lt("feed_date",to).limit(2000);
  if(FL.unit) nq=nq.eq("unit_id",FL.unit);
  const [{ data:days, error }, { data:prod }, { data:notes }] = await Promise.all([q,pq,nq]);
  const nm={}; (notes||[]).forEach(n=>{ nm[n.unit_id+"|"+n.feed_date]=n.note; });
  if(error){ body.innerHTML=`<div class="empty">Σφάλμα: ${esc(error.message)}</div>`; return; }
  const pm={}; (prod||[]).forEach(p=>{ pm[p.unit_id+"|"+p.log_date]=p; });
  const rows=(days||[]).slice().sort((a,b)=>String(b.feed_date).localeCompare(String(a.feed_date))||unitName(a.unit_id).localeCompare(unitName(b.unit_id),"el"));
  body.innerHTML = rows.length ? table(
    ["Ημ/νία","Μονάδα","t","VS (t)","OLR","HRT","Αναμ. CH₄ m³","Πραγμ. CH₄ m³","Απόδοση","Κόστος €",""],
    rows.map(d=>{
      const p=pm[d.unit_id+"|"+d.feed_date];
      const act=(p && p.biogas_m3!=null && p.ch4_pct!=null) ? p.biogas_m3*p.ch4_pct/100 : null;
      const eff=(act!=null && Number(d.ch4_expected_m3)>0) ? act/Number(d.ch4_expected_m3)*100 : null;
      const note=nm[d.unit_id+"|"+d.feed_date];
      return [fmtDate(d.feed_date)+(note?`<div class="feed-note" title="${esc(note)}">📝 ${esc(note.length>48?note.slice(0,47)+"…":note)}</div>`:""), esc(unitName(d.unit_id)), fmtNum(d.mass_t), Number(d.vs_t).toFixed(2),
        d.olr!=null ? stBadge(olrState(+d.olr),Number(d.olr).toFixed(2)) : "—",
        d.hrt!=null ? stBadge(hrtState(+d.hrt),Number(d.hrt).toFixed(0)) : "—",
        fmtNum(Math.round(d.ch4_expected_m3)), act!=null ? fmtNum(Math.round(act)) : "—",
        eff!=null ? stBadge(effState(eff),Math.round(eff)+"%") : "—", fmtNum(Math.round(d.cost_eur)),
        `<span style="display:flex;gap:6px;justify-content:flex-end"><button class="btn ghost sm" data-open="${d.unit_id}|${d.feed_date}">Άνοιγμα</button>${canWrite()?`<button class="btn ghost sm danger" data-delday="${d.unit_id}|${d.feed_date}">✕</button>`:""}</span>`];
    })) : `<div class="empty">Καμία τροφοδοσία για ${esc(FL.month)}.</div>`;
  body.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ const [u,d]=b.dataset.open.split("|"); openFeedingDay(u,d); });
  body.querySelectorAll("[data-delday]").forEach(b=>b.onclick=async()=>{
    const [u,d]=b.dataset.delday.split("|"); if(!confirm(`Διαγραφή τροφοδοσίας ${fmtDate(d)} — ${unitName(u)};`)) return;
    const { error:e } = await sb.from("feeding").delete().eq("tenant_id",T).eq("unit_id",u).eq("feed_date",d);
    if(e) return toast("Σφάλμα: "+e.message); toast("Διαγράφηκε"); refreshAlertBadge(); loadFeedingLog(); loadPrev();
  });
}

/* ============================ Digestate & nutrient balance ============================ */

async function loadDigestate(){
  const DG=state.digLog, T=state.tenantId, { from, to } = monthRange(DG.month), year=DG.month.slice(0,4);
  let q=sb.from("digestate").select("*").eq("tenant_id",T).gte("log_date",from).lt("log_date",to).order("log_date",{ascending:false}).limit(1000);
  if(DG.unit) q=q.eq("unit_id",DG.unit);
  const yq=sb.from("digestate").select("*").eq("tenant_id",T).eq("destination","field")
    .gte("log_date",year+"-01-01").lt("log_date",(Number(year)+1)+"-01-01").limit(5000);   // limit is per field, across plants
  const [{ data:rows, error }, { data:yr }] = await Promise.all([q,yq]);
  const body=$("#dg-body"); if(!body) return;
  if(error){ body.innerHTML=`<div class="empty">Σφάλμα: ${esc(error.message)}</div>`; return; }
  state._dig={rows:rows||[], month:DG.month};
  const mass=(rows||[]).reduce((s,r)=>s+(Number(r.mass_t)||0),0);
  const nut=k=>(rows||[]).reduce((s,r)=>s+(Number(r.mass_t)||0)*(Number(r[k])||0),0);
  const by={};
  (yr||[]).forEach(r=>{ const key=(r.recipient||"").trim().toLowerCase(); if(!key) return;
    const g=by[key]||(by[key]={name:r.recipient.trim(),mass:0,n:0,area:0,count:0});
    g.mass+=Number(r.mass_t)||0; g.n+=(Number(r.mass_t)||0)*(Number(r.n_kg_t)||0);
    g.area=Math.max(g.area,Number(r.field_area_ha)||0); g.count++; });
  const ytd=Object.values(by).map(g=>({...g,nha:g.area>0?g.n/g.area:null})).sort((a,b)=>(b.nha||0)-(a.nha||0));
  const maxNha=ytd.reduce((m,g)=>Math.max(m,g.nha||0),0);
  $("#dg-year").textContent=year;
  $("#dg-stats").innerHTML=
    statTile("Ποσότητα μήνα", fmtNum(mass)+" t")+
    statTile("Άζωτο (N)", fmtNum(Math.round(nut("n_kg_t")))+" kg")+
    statTile("P₂O₅", fmtNum(Math.round(nut("p2o5_kg_t")))+" kg")+
    statTile("K₂O", fmtNum(Math.round(nut("k2o_kg_t")))+" kg")+
    statTile("Μέγιστο N/ha (έτος)", ytd.length ? Math.round(maxNha)+" kg" : "—", stColor(nhaState(ytd.length?maxNha:null)));
  body.innerHTML = (rows||[]).length ? table(
    ["Ημ/νία","Μονάδα","Ποσότητα t","Προορισμός","Παραλήπτης","Έκταση ha","N kg/t","N kg","N kg/ha",""],
    rows.map(r=>{ const n=(Number(r.mass_t)||0)*(Number(r.n_kg_t)||0), nha=(r.destination==="field"&&Number(r.field_area_ha)>0)?n/Number(r.field_area_ha):null;
      return [fmtDate(r.log_date), esc(unitName(r.unit_id)), fmtNum(r.mass_t), esc(DIG_DEST[r.destination]||r.destination), esc(r.recipient||"—"),
        fmtNum(r.field_area_ha), fmtNum(r.n_kg_t), fmtNum(Math.round(n)), nha!=null?fmtNum(Math.round(nha)):"—",
        canWrite()?`<span style="display:flex;gap:6px;justify-content:flex-end"><button class="btn ghost sm" data-edit="${r.id}">✎</button><button class="btn ghost sm danger" data-del="${r.id}">✕</button></span>`:""]; })
  ) : `<div class="empty">Καμία κίνηση για ${esc(DG.month)}.</div>`;
  (rows||[]).forEach(r=>{
    const e=$(`#dg-body [data-edit="${r.id}"]`); if(e) e.onclick=()=>digestateForm(r);
    const d=$(`#dg-body [data-del="${r.id}"]`); if(d) d.onclick=async()=>{ if(!confirm("Διαγραφή εγγραφής;")) return;
      const { error:er } = await sb.from("digestate").delete().eq("id",r.id); if(er) return toast("Σφάλμα: "+er.message);
      toast("Διαγράφηκε"); refreshAlertBadge(); loadDigestate(); };
  });
  $("#dg-ytd").innerHTML = ytd.length ? table(
    ["Παραλήπτης / αγροτεμάχιο","Εφαρμογές","Ποσότητα t","N kg","Έκταση ha","N kg/ha/έτος","Όριο"],
    ytd.map(g=>[esc(g.name), g.count, fmtNum(g.mass), fmtNum(Math.round(g.n)), g.area?fmtNum(g.area):"—",
      g.nha!=null ? stBadge(nhaState(g.nha), Math.round(g.nha)+" kg") : `<span class="muted small">χωρίς έκταση</span>`,
      g.nha!=null ? `${Math.round(g.nha/N_LIMIT*100)}%` : "—"])
  ) : `<div class="empty">Καμία εφαρμογή σε αγρό το ${esc(year)}.</div>`;
}
function exportDigestateXlsx(){

    Προορισμός:DIG_DEST[r.destination]||r.destination, Παραλήπτης:r.recipient||"", "Έκταση (ha)":r.field_area_ha,

        +`(${Math.round(y.total/N_LIMIT*100)}% του ορίου ${N_LIMIT} kg N/ha/έτος σε Ζώνη Ευπρόσβλητη από Νιτρορύπανση).\n\nΑποθήκευση παρόλα αυτά;`)) return;
    const { error } = isEdit ? await sb.from("digestate").update(payload).eq("id",r.id)
                             : await sb.from("digestate").insert({...payload,tenant_id:state.tenantId,created_by:state.profile.id});
    if(error) return toast("Σφάλμα: "+error.message);
    close(); toast(isEdit?"Αποθηκεύτηκε":"Καταχωρήθηκε"); refreshAlertBadge();

    loadDigestate();
  });

const RHO_CH4 = 0.7175, RHO_CO2 = 1.977;                                    // kg/Nm³ (0 °C, 1 atm)
const biogasRho = ch4pct => { const x=(ch4pct==null||!isFinite(Number(ch4pct)) ? 53 : Number(ch4pct))/100; return x*RHO_CH4+(1-x)*RHO_CO2; };
function closureState(v){ if(v==null) return "na"; if(v<85||v>110) return "crit"; if(v<93||v>103) return "warn"; return "ok"; }
function vsrState(v){ if(v==null) return "na"; if(v<40) return "crit"; if(v<55) return "warn"; return "ok"; }
function etaState(v){ if(v==null) return "na"; if(v<30||v>46) return "warn"; return "ok"; }
