async function loadMassBalance(){
  const MB=state.mb, T=state.tenantId, { from, to } = monthRange(MB.month);
  const byUnit=q=>MB.unit ? q.eq("unit_id",MB.unit) : q;
  const [fe, pr, dg, an] = await Promise.all([
    byUnit(sb.from("feeding").select("*").eq("tenant_id",T).gte("feed_date",from).lt("feed_date",to).limit(20000)),
    byUnit(sb.from("production").select("*").eq("tenant_id",T).gte("log_date",from).lt("log_date",to).limit(5000)),
    byUnit(sb.from("digestate").select("*").eq("tenant_id",T).gte("log_date",from).lt("log_date",to).limit(5000)),
    sb.from("analyses").select("value,created_at,parameter:parameters(code),sample:samples(kind,unit_id)")
      .eq("tenant_id",T).lt("created_at",to).order("created_at",{ascending:false}).limit(3000),
  ]);
  const err=fe.error||pr.error||dg.error;
  if(err){ $("#mb-mass").innerHTML=`<div class="empty">Σφάλμα: ${esc(err.message)}</div>`; return; }
  const feed=fe.data||[], prod=pr.data||[], dig=dg.data||[];

  // inputs
  const byFs={}, vsByUnit={};
  let inT=0, inTS=0, inVS=0, ch4Exp=0;
  feed.forEach(r=>{
    const fs=state.feedstockById[r.feedstock_id]||{}, m=Number(r.mass_t)||0;
    const ts=m*(Number(fs.ts_pct)||0)/100, vs=ts*(Number(fs.vs_pct)||0)/100, c=vs*(Number(fs.bmp)||0);
    const g=byFs[r.feedstock_id]||(byFs[r.feedstock_id]={name:fs.name||"(άγνωστο)",m:0,ts:0,vs:0,c:0,days:new Set()});
    g.m+=m; g.ts+=ts; g.vs+=vs; g.c+=c; g.days.add(r.feed_date);
    inT+=m; inTS+=ts; inVS+=vs; ch4Exp+=c; vsByUnit[r.unit_id]=(vsByUnit[r.unit_id]||0)+vs;
  });
  // outputs
  let gasM3=0, gasT=0, ch4M3=0, kwhEl=0, kwhTh=0, chpH=0, flareH=0;
  prod.forEach(p=>{
    const v=Number(p.biogas_m3)||0;
    gasM3+=v; gasT+=v*biogasRho(p.ch4_pct)/1000; ch4M3+=v*(Number(p.ch4_pct)||0)/100;
    kwhEl+=Number(p.kwh_el)||0; kwhTh+=Number(p.kwh_th)||0; chpH+=Number(p.chp_hours)||0; flareH+=Number(p.flare_hours)||0;
  });
  const digT=dig.reduce((s,r)=>s+(Number(r.mass_t)||0),0);
  const outT=gasT+digT, gap=inT-outT, closure=inT>0 ? outT/inT*100 : null;
  // VS removal (Van Kleeck): feed VS/TS vs latest digester VS/TS per plant, weighted by VS fed
  const latestVs={};
  (an.data||[]).forEach(a=>{ if(!a.parameter||a.parameter.code!=="vs"||!a.sample||a.sample.kind!=="digester") return;
    if(latestVs[a.sample.unit_id]==null) latestVs[a.sample.unit_id]=Number(a.value)/100; });
  const fi=inTS>0 ? inVS/inTS : null;
  let w=0, fo=0; Object.entries(vsByUnit).forEach(([u,v])=>{ if(latestVs[u]!=null){ fo+=latestVs[u]*v; w+=v; } });
  fo = w>0 ? fo/w : null;
  const vsr=(fi!=null && fo!=null && fi-fi*fo>0) ? (fi-fo)/(fi-fi*fo)*100 : null;
  // energy
  const eCh4=ch4M3*CH4_KWH;                                                   // kWh (LHV)
  const etaEl=eCh4>0 ? kwhEl/eCh4*100 : null, etaTh=eCh4>0 ? kwhTh/eCh4*100 : null;
  const loss=(etaEl!=null&&etaTh!=null) ? 100-etaEl-etaTh : null;
  const specY=inVS>0 ? ch4M3/inVS : null, specExp=inVS>0 ? ch4Exp/inVS : null, eff=ch4Exp>0 ? ch4M3/ch4Exp*100 : null;
  const unitDays=new Set(prod.map(p=>p.unit_id+"|"+p.log_date)).size, avail=unitDays>0 ? chpH/(unitDays*24)*100 : null;
  const avgCh4=gasM3>0 ? ch4M3/gasM3*100 : null, rho=gasM3>0 ? gasT*1000/gasM3 : null;
  state._mb={month:MB.month, unit:MB.unit, inT,inTS,inVS,gasM3,gasT,digT,gap,closure,fi,fo,vsr,ch4M3,eCh4,kwhEl,kwhTh,etaEl,etaTh,loss,specY,specExp,eff,avail,flareH,byFs};

  const cs=closureState(closure), vs=vsrState(vsr);
  $("#mb-stats").innerHTML=
    statTile("Είσοδος μάζας", fmtNum(Math.round(inT))+" t")+
    statTile("Έξοδος μάζας", fmtNum(Math.round(outT))+" t")+
    statTile("Κλείσιμο ισοζυγίου", closure!=null ? closure.toFixed(1)+"%" : "—", stColor(cs))+
    statTile("Απομάκρυνση VS", vsr!=null ? Math.round(vsr)+"%" : "—", stColor(vs))+
    statTile("m³ CH₄ / t VS", specY!=null ? Math.round(specY)+(specExp?` / ${Math.round(specExp)}`:"") : "—", stColor(eff==null?"na":effState(eff)))+
    statTile("η ηλεκτρ. ΣΗΘ", etaEl!=null ? etaEl.toFixed(1)+"%" : "—", stColor(etaState(etaEl)));

  // data-quality & process notes
  const notes=[];
  const feedDays=new Set(feed.map(r=>r.unit_id+"|"+r.feed_date)), prodDays=new Set(prod.map(p=>p.unit_id+"|"+p.log_date));
  const noProd=[...feedDays].filter(k=>!prodDays.has(k)).length, noFeed=[...prodDays].filter(k=>!feedDays.has(k)).length;
  if(!feed.length && !prod.length) notes.push("Δεν υπάρχουν καταγραφές τροφοδοσίας ή παραγωγής για την περίοδο.");
  if(closure!=null && (cs==="warn"||cs==="crit")) notes.push(gap>0
    ? `<b>Το ισοζύγιο δεν κλείνει:</b> ${fmtNum(Math.round(gap))} t (${(100-closure).toFixed(1)}%) δεν εμφανίζονται στις εξόδους — πιθανή αύξηση στάθμης χωνευτή/δεξαμενών ή ελλιπής καταγραφή απομάκρυνσης χωνεύματος.`
    : `<b>Οι έξοδοι υπερβαίνουν τις εισόδους</b> κατά ${fmtNum(Math.round(-gap))} t — πιθανή εκκένωση αποθέματος ή διπλοκαταχώριση απομάκρυνσης.`);
  if(noProd) notes.push(`${noProd} ημέρες-μονάδες με τροφοδοσία χωρίς καταγραφή παραγωγής.`);
  if(noFeed) notes.push(`${noFeed} ημέρες-μονάδες με παραγωγή χωρίς καταγραφή τροφοδοσίας.`);
  if(inVS>0 && fo==null) notes.push("Δεν βρέθηκε ανάλυση <b>VS χωνευτή</b> (δείγμα τύπου «Χωνευτής») — δεν υπολογίζεται η απομάκρυνση οργανικής ουσίας.");
  if(vs==="warn"||vs==="crit") notes.push(`<b>Χαμηλή απομάκρυνση VS (${Math.round(vsr)}%)</b> — η οργανική ουσία δεν αξιοποιείται πλήρως· έλεγξε φόρτιση (OLR), χρόνο παραμονής και σταθερότητα (FOS/TAC).`);
  if(eff!=null && effState(eff)==="warn") notes.push(`Η πραγματική παραγωγή μεθανίου είναι <b>${Math.round(eff)}%</b> της αναμενόμενης από το BMP των υποστρωμάτων.`);
  if(etaEl!=null && etaState(etaEl)==="warn") notes.push(`Ηλεκτρικός βαθμός απόδοσης <b>${etaEl.toFixed(1)}%</b> εκτός του τυπικού 33–45% — έλεγξε μετρητές αερίου/ενέργειας ή κατάσταση ΣΗΘ.`);
  if(flareH>0) notes.push(`Λειτουργία πυρσού ${fmtNum(flareH)} ώρες — καμένο αέριο χωρίς ενεργειακή αξιοποίηση.`);
  $("#mb-notes").innerHTML = notes.length ? `<div class="hint warn">⚠ <b>Παρατηρήσεις</b><ul>${notes.map(n=>`<li>${n}</li>`).join("")}</ul></div>`
    : (inT>0 ? `<div class="hint ok">✓ Το ισοζύγιο κλείνει (${closure.toFixed(1)}%) και οι δείκτες είναι εντός τυπικών ορίων.</div>` : "");

  $("#mb-flow").innerHTML = inT>0 ? mbFlowSvg(inT,[
    {label:"Χώνευμα", t:digT, color:"var(--accent)"},
    {label:"Βιοαέριο", t:gasT, color:"var(--primary)"},
    {label:gap>=0?"Απόθεμα / μη καταγεγραμμένα":"Υπέρβαση εξόδων", t:Math.abs(gap), color:"var(--faint)"},
  ]) : `<div class="empty">Καμία τροφοδοσία για ${esc(MB.month)}.</div>`;

  const row=(k,v,sub)=>[k,`<b>${v}</b>`,sub?`<span class="small muted">${sub}</span>`:""];
  $("#mb-mass").innerHTML=table(["","",""],[
    row("Υποστρώματα (νωπό βάρος)", fmtNum(Math.round(inT))+" t"),
    row("↳ ξηρή ουσία (TS)", fmtNum(r1n(inTS))+" t", inT>0?(inTS/inT*100).toFixed(1)+"% του νωπού":""),
    row("↳ οργανική ουσία (VS)", fmtNum(r1n(inVS))+" t", fi!=null?(fi*100).toFixed(1)+"% του TS":""),
    row("Βιοαέριο", fmtNum(r1n(gasT))+" t", gasM3?`${fmtNum(Math.round(gasM3))} m³ · ρ ${rho.toFixed(3)} kg/m³`:""),
    row("Χώνευμα (απομάκρυνση)", fmtNum(Math.round(digT))+" t", `${dig.length} κινήσεις`),
    row(gap>=0?"Απόθεμα / μη καταγεγραμμένα":"Υπέρβαση εξόδων", fmtNum(Math.round(Math.abs(gap)))+" t", inT>0?(Math.abs(gap)/inT*100).toFixed(1)+"% της εισόδου":""),
    row("Κλείσιμο ισοζυγίου", closure!=null?stBadge(cs,closure.toFixed(1)+"%"):"—", "έξοδοι / είσοδοι"),
    row("Απομάκρυνση VS (Van Kleeck)", vsr!=null?stBadge(vs,Math.round(vsr)+"%"):"—", (fi!=null&&fo!=null)?`VS/TS τροφοδοσίας ${(fi*100).toFixed(0)}% → χωνευτή ${(fo*100).toFixed(0)}%`:""),
  ]).replace(/<thead>[\s\S]*?<\/thead>/,"");
  $("#mb-energy").innerHTML=table(["","",""],[
    row("Βιοαέριο", fmtNum(Math.round(gasM3))+" m³", avgCh4!=null?`Μ.Ο. CH₄ ${avgCh4.toFixed(1)}%`:""),
    row("Μεθάνιο", fmtNum(Math.round(ch4M3))+" m³", "LHV 9,97 kWh/m³"),
    row("Ενέργεια μεθανίου", fmtNum(r1n(eCh4/1000))+" MWh", "100%"),
    row("Ηλεκτρική ενέργεια", fmtNum(r1n(kwhEl/1000))+" MWh", etaEl!=null?stBadge(etaState(etaEl),"η "+etaEl.toFixed(1)+"%"):""),
    row("Θερμική ενέργεια", fmtNum(r1n(kwhTh/1000))+" MWh", etaTh!=null?"η "+etaTh.toFixed(1)+"%":""),
    row("Απώλειες / μη αξιοποίηση", loss!=null?loss.toFixed(1)+"%":"—", flareH?`πυρσός ${fmtNum(flareH)} h`:""),
    row("Ειδική απόδοση", specY!=null?Math.round(specY)+" m³ CH₄/t VS":"—", specExp?`αναμενόμενη ${Math.round(specExp)} (BMP) → ${Math.round(eff)}%`:""),

// Simple two-column flow diagram (inputs → outputs), heights proportional to tonnes.
function mbFlowSvg(inT, outs){
  const W=900, H=230, top=18, h=180, x0=170, x1=520, bw=18, mid=(x0+bw+x1)/2;
  const total=Math.max(inT, outs.reduce((s,o)=>s+Math.max(o.t,0),0), 1e-9), sc=h/total;

  outs.forEach(o=>{

    yL+=hh; yR+=hh;

}

async function loadRed3(){

  const from=`${R.year}-01-01`, to=`${R.year+1}-01-01`;
  const byUnit=q=>R.unit ? q.eq("unit_id",R.unit) : q;
  const [fe,pr]=await Promise.all([
    byUnit(sb.from("feeding").select("feedstock_id,mass_t").eq("tenant_id",T).gte("feed_date",from).lt("feed_date",to).limit(20000)),
    byUnit(sb.from("production").select("kwh_el,biogas_m3,ch4_pct").eq("tenant_id",T).gte("log_date",from).lt("log_date",to).limit(5000)),
  ]);
  if(fe.error){ $("#r3-mix").innerHTML=`<div class="empty">Σφάλμα: ${esc(fe.error.message)}</div>`; return; }
  const feed=fe.data||[], prod=pr.data||[], SUP=["manure","maize","biowaste"], MJ_CH4=CH4_KWH*3.6;  // 9.97 kWh×3.6 = MJ/m³ CH₄
  // aggregate fresh mass + real CH₄ energy (BMP-based) per feedstock & per RED III class
  const byClass={}, byClassE={}, byName={}; let eTot=0;
  feed.forEach(r=>{ const f=state.feedstockById[r.feedstock_id]||{}, cls=f.red_class||"other", m=Number(r.mass_t)||0;
    const eMJ=m*(fsCh4(f)||0)*MJ_CH4;
    byClass[cls]=(byClass[cls]||0)+m; byClassE[cls]=(byClassE[cls]||0)+eMJ; eTot+=eMJ;
    const g=byName[r.feedstock_id]||(byName[r.feedstock_id]={name:f.name||"(άγνωστο)",cls,m:0,e:0}); g.m+=m; g.e+=eMJ; });
  const hasAny=Object.values(byClass).some(x=>x>0);
  const supportedLines=Object.entries(byClass).filter(([c,v])=>v>0&&SUP.includes(c)).map(([substrate,massFresh])=>({substrate,massFresh}));
  const otherClasses=Object.keys(byClass).filter(c=>byClass[c]>0&&!SUP.includes(c));
  const uncoveredShare = eTot>0 ? otherClasses.reduce((s,c)=>s+(byClassE[c]||0),0)/eTot : (otherClasses.length?1:0);
  let kwhEl=0, ch4M3=0;
  prod.forEach(p=>{ kwhEl+=Number(p.kwh_el)||0; ch4M3+=(Number(p.biogas_m3)||0)*(Number(p.ch4_pct)||0)/100; });
  const product=R.product;
  const mjProduct = product==="transport" ? ch4M3*MJ_CH4 : kwhEl*3.6;          // kWh→MJ
  const mjCovered = mjProduct*(1-uncoveredShare);                              // only the fraction with defaults

    valueType:R.valueType, commissioningDate:u?.commissioning_date||null,

  state._red3={R,u,a,verdict,supportedLines,byClass,byClassE,byName,eTot,uncoveredShare,hasOther,hasAny,otherClasses,kwhEl,ch4M3,mjProduct,mjCovered,from,to};

  const v=RED_VERDICT[verdict]||RED_VERDICT.na;
  $("#r3-verdict").innerHTML = hasAny ? `<div class="hint ${v.cls==='crit'?'warn':v.cls==='ok'?'ok':'info'}" style="font-size:15px">
      <b style="font-size:17px">${v.icon} ${v.t}</b>${m.savingPct!=null?` — μείωση GHG <b>${m.savingPct}%</b>${hasOther?" (στο τμήμα με προεπιλογές)":""}`:""}
      ${t.minSavingPct?` έναντι ορίου <b>${t.minSavingPct}%</b>${a.marginPct!=null?` (περιθώριο ${a.marginPct>=0?"+":""}${a.marginPct} μ.β.)`:""}`:""}
      ${hasOther?`<br><span class="small">Το <b>${Math.round(uncoveredShare*100)}%</b> της ενέργειας προέρχεται από υποστρώματα χωρίς προεπιλεγμένη τιμή (${otherClasses.map(c=>RED_CLASS[c]||c).join(", ")}) — για πλήρη συμμόρφωση απαιτείται πραγματικός υπολογισμός.</span>`:""}
    </div>` : `<div class="hint info">Καμία τροφοδοσία για το ${R.year}${R.unit?" στη μονάδα αυτή":""}. Καταχώρισε τροφοδοσία για να υπολογιστεί η μείωση GHG.</div>`;

  const sav=m.savingPct, thr=t.minSavingPct;
  const savColor = sav==null?"na":(thr&&sav>=thr?"ok":thr?"crit":"ok");
  $("#r3-stats").innerHTML = hasAny ? (
    statTile(hasOther?"Μείωση GHG (τμήμα)":"Μείωση GHG", sav!=null?sav+"%":"—", stColor(savColor))+
    statTile("Όριο 29(10)", thr?thr+"%":"—")+
    statTile(product==="transport"?"Εκπομπές βιομεθανίου":"Εκπομπές (ανά MJ ηλ.)", m.E!=null?RED3.round(m.E,1)+" g":"—")+
    statTile(product==="transport"?"Ενέργεια βιομεθανίου":"Ηλ. ενέργεια (έτος)", fmtNum(Math.round(mjProduct/3600))+" MWh")+
    statTile("Αποφυγή CO₂eq", a.avoidedTonnesCO2e!=null?fmtNum(Math.round(a.avoidedTonnesCO2e))+" t"+(hasOther?"*":""):"—")
  ) : "";

      ${u?.commissioning_date?`<div class="small">Έναρξη λειτουργίας: <b>${u.commissioning_date}</b></div>`:`<div class="small muted">Χωρίς ημ/νία έναρξης — ρύθμισέ την στη μονάδα.</div>`}
      ${u?.rated_thermal_input_mw!=null?`<div class="small">Θερμική ισχύς: <b>${fmtNum(u.rated_thermal_input_mw)} MW</b></div>`:""}
      ${!t.inScope&&t.scopeNote?`<div class="hint info" style="margin:8px 0 0;padding:8px 10px">${esc(t.scopeNote)}</div>`:""}
      ${a.caseNote?`<div class="small muted" style="margin-top:8px">${esc(a.caseNote)}</div>`:""}
    </div>`;

  // mix breakdown: each class by share of TOTAL plant CH₄ energy (BMP-based)
  const rows=Object.entries(byClass).filter(([,v2])=>v2>0).sort((x,y)=>(byClassE[y[0]]||0)-(byClassE[x[0]]||0)).map(([cls,mass])=>{

    : `<div class="empty">Καμία τροφοδοσία για το ${R.year}.</div>`;

  if(hasOther) notes.push(`Υποστρώματα χωρίς προεπιλεγμένη τιμή (${otherClasses.map(c=>RED_CLASS[c]||c).join(", ")}): η Οδηγία δίνει προεπιλογές μόνο για κοπριά, ενεργειακές καλλιέργειες (maize whole plant) και βιοαπόβλητα. Αντιστοιχούν στο <b>${Math.round(uncoveredShare*100)}%</b> της ενέργειας — για το σύνολο της μονάδας απαιτείται πραγματικός υπολογισμός (actual values) ή πιστοποιημένη τιμή.`);
  if(verdict==="fail") notes.push(`Με προεπιλεγμένες τιμές ${hasOther?"το τμήμα με προεπιλογές ":"η μονάδα "}<b>υπολείπεται ${Math.abs(a.marginPct)} μ.β.</b> του ορίου. Επιλογές: αύξηση μεριδίου κοπριάς, αεροστεγής αποθήκευση χωνεύματος (close digestate), ή πραγματικός υπολογισμός/πιστοποίηση που συνήθως δίνει υψηλότερη μείωση.`);
  if(verdict==="no_threshold_yet") notes.push(`Για τη μονάδα αυτή το όριο 80% ενεργοποιείται αργότερα (μονάδα προ 2021 — μετά 15 έτη λειτουργίας). Μέχρι τότε δεν υπάρχει υποχρεωτικό όριο, αλλά ο υπολογισμός χρησιμεύει για αυτοπαρακολούθηση.`);
  if(R.digestate==="open" && (verdict==="fail"||verdict==="requires_actual")) notes.push(`Το σενάριο χρησιμοποιεί <b>ανοιχτή</b> αποθήκευση χωνεύματος — δοκίμασε «Αεροστεγής» για να δεις την επίδραση.`);
  if(!u?.rated_thermal_input_mw) notes.push(`Χωρίς ονομαστική θερμική ισχύ δεν ελέγχεται η εφαρμοσιμότητα (≥2 MW) ούτε το κατώφλι 10 MW — συμπλήρωσέ την στη μονάδα.`);
  if(hasOther && a.avoidedTonnesCO2e!=null) notes.push(`* Η αποφυγή CO₂eq λογίζεται μόνο για το <b>${Math.round((1-uncoveredShare)*100)}%</b> της ενέργειας που έχει προεπιλεγμένη τιμή.`);
  $("#r3-notes").innerHTML = notes.length ? `<div class="hint warn">⚠ <b>Παρατηρήσεις</b><ul>${notes.map(n=>`<li>${n}</li>`).join("")}</ul></div>` : "";

  // scenario comparison grid (what-if): savings % for storage × case/offgas
  renderRed3Scenarios(cfg);
}
function renderRed3Scenarios(cfg){
  const el2=$("#r3-scen"); if(!el2) return;
  const lines=cfg.lines; if(!lines.length){ el2.innerHTML=`<div class="empty">—</div>`; return; }
  const cur=`${cfg.digestate}|${cfg.product==="transport"?cfg.offgas:cfg.caseType}`;
  const mk=(digestate,key)=>{ const o=cfg.product==="transport"?{offgas:key}:{caseType:key};
    const r=RED3.mix({lines,product:cfg.product,digestate,valueType:cfg.valueType,...o});
    const hit=`${digestate}|${key}`===cur;
    return r.savingPct==null?"—":`<span${hit?' style="font-weight:800;text-decoration:underline"':''}>${r.savingPct}%${r.requiresActual?"*":""}</span>`; };
  const cols = cfg.product==="transport" ? [["no","χωρίς καύση off-gas"],["yes","με καύση off-gas"]]
                                         : [[1,"Case 1"],[2,"Case 2"],[3,"Case 3"]];
  const hasOther=(state._red3||{}).hasOther;
  el2.innerHTML = table(
    ["Αποθήκευση χωνεύματος", ...cols.map(c=>c[1])],
    [["open",...cols.map(c=>mk("open",c[0]))],["close",...cols.map(c=>mk("close",c[0]))]]
      .map(r=>[r[0]==="open"?"Ανοιχτή (open)":"Αεροστεγής (close)", ...r.slice(1)])
  ) + `<div class="small muted" style="padding:4px 14px">Μείωση GHG (%) στο τμήμα με προεπιλογές, ανά σενάριο· υπογραμμισμένο = τρέχον.${hasOther?" Μέρος του μίγματος δεν έχει προεπιλογή (βλ. παρατηρήσεις).":""}</div>`;
}

/* ============================ helpers: table builder ============================ */
function table(headers, rows, rowClicks){
  const thead=`<thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead>`;
  const tbody=`<tbody>${rows.map((r,i)=>`<tr${rowClicks&&rowClicks[i]?' class="clickable" data-ri="'+i+'"':''}>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody>`;
  const html=`<table>${thead}${tbody}</table>`;
  // defer binding of row clicks
  setTimeout(()=>{ if(rowClicks) $$("tr[data-ri]").forEach(tr=>{const f=rowClicks[+tr.dataset.ri]; if(f) tr.onclick=f;}); },0);
  return html;
}

/* after password auth: enforce MFA if the account has a verified factor */
async function afterAuth(user){
  try{
    const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if(aal && aal.currentLevel==="aal1" && aal.nextLevel==="aal2"){ return promptMfa(user); }
  }catch(_){}
  await onLoggedIn(user);
}
function promptMfa(user){
  const body=el("div");
  body.innerHTML=`<p class="muted small">Εισήγαγε τον 6-ψήφιο κωδικό από την εφαρμογή authenticator σου.</p>
    <div class="field"><label>Κωδικός 2FA</label>
      <input class="input" id="mfa-code" inputmode="numeric" maxlength="6" placeholder="000000" style="letter-spacing:5px;text-align:center;font-size:20px"></div>
    <div id="mfa-msg"></div>`;
  modal("Επαλήθευση 2 βημάτων", body, async close=>{
    const code=$("#mfa-code").value.trim();
    const { data:f } = await sb.auth.mfa.listFactors();
    const totp=((f&&f.totp)||[])[0]; if(!totp){ close(); return onLoggedIn(user); }
    const { data:ch, error:ce } = await sb.auth.mfa.challenge({ factorId: totp.id });
    if(ce){ $("#mfa-msg").innerHTML=`<div class="msg err">${esc(ce.message)}</div>`; return; }
    const { error:ve } = await sb.auth.mfa.verify({ factorId: totp.id, challengeId: ch.id, code });
    if(ve){ $("#mfa-msg").innerHTML=`<div class="msg err">Λάθος κωδικός, δοκίμασε ξανά.</div>`; return; }
    close(); await onLoggedIn(user);
  }, "Επαλήθευση");
}

let LANG = localStorage.getItem("lp-lang")||"el";
function trFull(s){
  if(I18N[s]) return I18N[s];
  const m=s.match(/^([＋+←▼▲✓€🧪⚙▣⊞📊🏭👥🗂🎨🔒⎋]+\s*)(.+)$/);  // strip a leading symbol
  if(m && I18N[m[2]]) return m[1]+I18N[m[2]];
  return null;
}
function translateNode(root){
  if(LANG!=="en"||!root) return;
  if(root.nodeType===3){ const t=root.nodeValue.trim(); const e=t&&trFull(t); if(e) root.nodeValue=root.nodeValue.replace(t,e); return; }
  if(root.nodeType!==1) return;
  const walk=document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes=[]; while(walk.nextNode()) nodes.push(walk.currentNode);
  nodes.forEach(n=>{ const t=n.nodeValue.trim(); const e=t&&trFull(t); if(e) n.nodeValue=n.nodeValue.replace(t,e); });
  (root.querySelectorAll?root.querySelectorAll("[placeholder]"):[]).forEach(el2=>{
    const p=el2.getAttribute("placeholder"); if(p&&I18N[p]) el2.setAttribute("placeholder",I18N[p]);
  });
  if(root.hasAttribute&&root.hasAttribute("placeholder")){ const p=root.getAttribute("placeholder"); if(I18N[p]) root.setAttribute("placeholder",I18N[p]); }
}
function initI18n(){
  $("#lang-toggle").textContent = LANG==="en" ? "ΕΛ" : "EN";
  $("#lang-toggle").onclick=()=>{ LANG = LANG==="en"?"el":"en"; localStorage.setItem("lp-lang",LANG); location.reload(); };
  if(LANG!=="en") return;
  document.documentElement.lang="en";
  const obs=new MutationObserver(muts=>muts.forEach(m=>m.addedNodes.forEach(nd=>translateNode(nd))));
  obs.observe(document.body,{childList:true,subtree:true});
  translateNode(document.body);
}
initI18n();

boot();
